[package]
name = "smart-explorer-share-server"
version = "0.1.0"
edition = "2021"
description = "Untrusted Smart Explorer signaling server with an optional Iroh encrypted-traffic relay."

[[bin]]
name = "se-share-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
iroh-base = "1.0.0"
iroh-relay = { version = "1.0.0", default-features = false, features = ["server"] }
lru = "0.18"
tokio = { version = "1", features = ["rt-multi-thread"] }

[patch.crates-io]
iroh-relay = { path = "../vendor/iroh-relay-1.0.0" }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

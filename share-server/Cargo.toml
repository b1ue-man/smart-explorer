[package]
name = "smart-explorer-share-server"
version = "0.1.0"
edition = "2021"
description = "Untrusted Smart Explorer signaling server with an optional Iroh encrypted-traffic relay."

[[bin]]
name = "se-share-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
iroh-base = { version = "1.0.0", features = ["key"] }
iroh-relay = { version = "1.0.0", default-features = false, features = ["server"] }
# RV1: terminate TLS with the same ring provider used by the desktop clients;
# no OpenSSL/aws-lc dependency is introduced for cross-platform releases.
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
lru = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }

[dev-dependencies]
rcgen = "0.14"

[patch.crates-io]
iroh-relay = { path = "../vendor/iroh-relay-1.0.0" }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

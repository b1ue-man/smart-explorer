android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
# Configuration cache stays off until the remote build is proven; the build scripts only read
# files through providers.fileContents, so enabling it later is a one-line change:
# org.gradle.configuration-cache=true
#
# Required on every invocation (not stored here because it is machine-specific):
#   -PrustlsVerifierMaven=<rustls-platform-verifier-android crate>/maven

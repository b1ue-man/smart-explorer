name: mount-recovery-cache-task
run-name: Mount recovery and cache ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact pushed source SHA (must match selected ref)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mount-recovery-cache-task-${{ github.repository }}
  cancel-in-progress: false

jobs:
  suite:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the single suite to its pushed candidate
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_SHA -notmatch '^[a-fA-F0-9]{40}$') { throw 'A full candidate SHA is required.' }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:CANDIDATE_SHA -or $head -ne $env:GITHUB_SHA) {
              throw 'Requested candidate, workflow ref and checkout differ.'
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: windows-mount-batching
          cache-on-failure: true

      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mount-recovery-cache-task-binary
          key: mount-recovery-cache-task-binary-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mount-recovery-cache-task-binary-${{ runner.os }}-${{ runner.arch }}-

      - name: Run the single mount-recovery-cache task entrypoint
        shell: pwsh
        timeout-minutes: 170
        run: >-
          ./native/test-mount-recovery-cache-task.ps1
          -LogRoot (Join-Path $env:RUNNER_TEMP 'mount-recovery-cache-task')
          -BinaryCacheRoot (Join-Path $env:RUNNER_TEMP 'mount-recovery-cache-task-binary')

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/mount-recovery-cache-task-binary
          key: mount-recovery-cache-task-binary-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mount-recovery-cache-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mount-recovery-cache-task
          if-no-files-found: error
          retention-days: 14

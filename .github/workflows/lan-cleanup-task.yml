name: lan-cleanup-task

# Single task-level suite for the connection-cleanup / Drive-duplicates /
# LAN-presence / uplink-sharing batch. Dispatch it once for the exact pushed
# candidate SHA after implementation ends; it never publishes anything.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to verify (must match the selected ref)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lan-cleanup-task-${{ github.repository }}
  cancel-in-progress: false

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the run to the exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          log_root="$RUNNER_TEMP/lan-cleanup-task-logs"
          mkdir -p "$log_root"
          printf 'SMART_EXPLORER_TASK_LOG_ROOT=%s\n' "$log_root" >> "$GITHUB_ENV"
          checked_out_sha="$(git rev-parse HEAD)"
          printf 'requested_sha=%s\nworkflow_sha=%s\nchecked_out_sha=%s\n' \
            "$CANDIDATE_SHA" "$GITHUB_SHA" "$checked_out_sha" \
            > "$log_root/candidate.txt"
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be one full 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA,,}" != "${GITHUB_SHA,,}" ]] || \
             [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Selected ref, requested candidate, and checked-out commit differ."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          # The fix loop reruns this same suite; keep the dependency build
          # when a candidate fails so only the changed crate is rebuilt.
          cache-on-failure: true

      - name: Run the single task-level suite
        shell: bash
        timeout-minutes: 80
        run: |
          set -Eeuo pipefail
          bash native/test-lan-cleanup-task.sh --direct 2>&1 | \
            tee "$SMART_EXPLORER_TASK_LOG_ROOT/suite.log"

      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lan-cleanup-task-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lan-cleanup-task-logs

name: Release (assets only, parallel builds)

# One complete release whose payloads live only in the GitHub Release
# (plan docs/plaene/2026-11-01-idealzustand, D8). Windows, Linux and Android
# build at the same time on their own runners from one prepared source
# (version, embedded SSH-agent bundles, license notices); the publish job
# binds the 26 assets to their hashes, the installer to its payloads, and
# publishes them as one release: draft, upload, verify, then latest. No build
# is committed to Git: the release commit carries only the version and the
# prepared sources. dry_run builds and verifies everything into a draft and
# deletes it again, without commit, tag or visible release.

run-name: >-
  ${{ inputs.dry_run && 'Release dry run' || 'Release' }} from ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main SHA to release
        required: true
        type: string
      dry_run:
        description: Build and verify into a draft that is deleted again
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: smart-explorer-complete-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Bind to the exact main source and resolve the version
        id: plan
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw "source_sha must be one full commit ID." }
          $head = (git rev-parse 'HEAD^{commit}').Trim()
          $main = (git rev-parse 'refs/remotes/origin/main^{commit}').Trim()
          if ($head -ne $env:SOURCE_SHA.ToLowerInvariant() -or $main -ne $head) {
            throw "Release source drift: input=$env:SOURCE_SHA HEAD=$head origin/main=$main."
          }
          $repoRoot = (Resolve-Path ".").Path
          $scriptRoot = Join-Path $repoRoot "native"
          . (Join-Path $scriptRoot "release-publication.ps1")
          . (Join-Path $scriptRoot "release-version.ps1")
          $plan = Resolve-ReleasePlan
          if ($plan.Action -ne "Bump") { throw "Expected a new patch version, got $($plan.Action) $($plan.Version)." }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$($plan.Version)"
          Write-Host "Release plan: $($plan.Version)."

  prepare:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Install the musl and cross tools of the agent bundles
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Version, embedded SSH-agent bundles and license notices
        shell: pwsh
        env:
          PLAN_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $repoRoot = (Resolve-Path ".").Path
          $scriptRoot = Join-Path $repoRoot "native"
          . (Join-Path $scriptRoot "release-publication.ps1")
          . (Join-Path $scriptRoot "release-version.ps1")
          Set-NativeVersion $env:PLAN_VERSION
          bash native/build-agent-bundles.sh
          if ($LASTEXITCODE -ne 0) { throw "SSH-agent bundles failed." }
          pwsh -NoProfile -NonInteractive -File native/rust-licenses.ps1 -Mode Generate -EnsureTool
          if ($LASTEXITCODE -ne 0) { throw "License notice generation failed." }
          pwsh -NoProfile -NonInteractive -File native/rust-licenses.ps1 -Mode Check -EnsureTool
          if ($LASTEXITCODE -ne 0) { throw "License notices are incomplete." }

      - uses: actions/upload-artifact@v4
        with:
          name: prepared
          path: |
            native/Cargo.toml
            native/Cargo.lock
            native/agent-bin/se-agent-x86_64-linux-musl
            native/agent-bin/se-agent-aarch64-linux-musl
            third-party/rust-crates/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: [plan, prepare]
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: .

      - uses: dtolnay/rust-toolchain@stable

      - name: Windows release tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $makensis = @("$env:ProgramFiles\NSIS\makensis.exe", "${env:ProgramFiles(x86)}\NSIS\makensis.exe")
          foreach ($attempt in 1..3) {
            choco install strawberryperl nsis -y --no-progress
            if ($makensis | Where-Object { Test-Path -LiteralPath $_ }) { break }
            if ($attempt -eq 3) { throw "NSIS (makensis.exe) is still missing after $attempt attempts." }
            Start-Sleep -Seconds 60
          }

      - name: Build the Windows payloads, share server, context-menu DLL and installer
        shell: pwsh
        timeout-minutes: 170
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "windows"
          New-Item -ItemType Directory -Force (Join-Path $out "update-feed"), (Join-Path $out "release") | Out-Null
          pwsh -NoProfile -File native/publish-update.ps1 -AllowPartialFeed -DeferFeedVersion `
            -Feed (Join-Path $out "update-feed") -ReleaseOutput (Join-Path $out "release")
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed." }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ runner.temp }}/windows
          if-no-files-found: error
          retention-days: 3

  linux:
    needs: [plan, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: .

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl

      - name: Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools pkg-config file python3 xauth x11-utils xvfb \
            libegl1 libgl1 libgl1-mesa-dri libx11-6 libx11-xcb1 libxcursor1 libxi6 libxkbcommon0 \
            libxkbcommon-x11-0 libxrandr2

      - name: Build the Linux payloads and share server
        timeout-minutes: 110
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/linux"
          mkdir -p "$out/update-feed" "$out/share-server"
          SMART_EXPLORER_FEED_DIR="$out/update-feed" SMART_EXPLORER_SHARE_DIR="$out/share-server" \
            bash native/publish-linux-feed-wsl.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ runner.temp }}/linux
          if-no-files-found: error
          retention-days: 3

  android:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      - name: Build and verify the signed Android release APK
        timeout-minutes: 160
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAN_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          pwsh -NoProfile -Command '$ErrorActionPreference="Stop"; $repoRoot = (Resolve-Path ".").Path; $scriptRoot = Join-Path $repoRoot "native"; . (Join-Path $scriptRoot "release-publication.ps1"); . (Join-Path $scriptRoot "release-version.ps1"); Set-NativeVersion $env:PLAN_VERSION'
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::The ANDROID_KEYSTORE_B64 repository secret is missing."
            exit 1
          fi
          signing_dir="$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")"
          trap 'rm -rf -- "$signing_dir"' EXIT
          chmod 700 "$signing_dir"
          (umask 077 && printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$signing_dir/release.p12")
          unset ANDROID_KEYSTORE_B64
          export ANDROID_KEYSTORE_FILE="$signing_dir/release.p12"
          bash android/build-release-apk.sh --expect-version "$PLAN_VERSION" --out "$RUNNER_TEMP/android"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/android
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [plan, prepare, windows, linux, android]
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PLAN_VERSION: ${{ needs.plan.outputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Assemble, verify and publish the 26 release assets
        shell: pwsh
        run: native/publish-release-assets.ps1

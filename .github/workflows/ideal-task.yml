name: Ideal state, release feed and parallel content check

# The task-level suite of the 2026-11-01 batch (docs/plaene/2026-11-01-idealzustand):
# unit  - clippy findings on changed lines, then the batch's library tests
#         (`ideal_task_`: release feed, verify pool, first compare of copies) and the
#         directly affected ones (`updater::`, `abgleich_task_`) on Linux and Windows.
# measure - `se sync compare` of two copies of one tree with other times and no stored
#         state, the released v0.5.190 (its release asset, hash-checked) against the
#         candidate built here; equal results required, times and CPU use reported.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full pushed candidate SHA, matching the selected ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ideal-task-${{ github.repository }}
  cancel-in-progress: false

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          git rev-parse --verify 'v0.5.190^{commit}'

      - name: Rust toolchain and dependency cache
        uses: ./.github/actions/native-setup
        with:
          components: clippy
          workspaces: native

      - name: Clippy on library, binaries and tests; findings on changed lines fail
        shell: bash
        timeout-minutes: 160
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" native/test-ideal-task.py --job clippy --since v0.5.190

      - name: Batch and directly affected library tests
        shell: bash
        timeout-minutes: 120
        working-directory: native
        run: cargo test --lib -- ideal_task_ abgleich_task_ 'updater::' 'share::exec_grant_runtime::'

  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Rust toolchain and dependency cache
        uses: ./.github/actions/native-setup
        with:
          workspaces: native

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build the candidate se (release profile)
        shell: bash
        timeout-minutes: 120
        working-directory: native
        run: cargo build --release --locked --bin se

      - name: Measure the first compare of two copies (v0.5.190 against the candidate)
        shell: bash
        timeout-minutes: 90
        run: >-
          python native/test-ideal-task.py --job measure --old-tag v0.5.190
          --new native/target/release/se --log-root "$RUNNER_TEMP/ideal-measure"

      - name: Summary
        if: always()
        shell: bash
        run: |
          summary="$RUNNER_TEMP/ideal-measure/summary.md"
          if [[ -f "$summary" ]]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; cat "$summary"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ideal-measure-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/ideal-measure
          if-no-files-found: warn
          retention-days: 14

name: Build measurement

# Evidence for the build settings of the release (plan
# docs/plaene/2026-11-01-idealzustand, D9/D10/D14), on the runners the release
# uses: wall time per crate (cargo --timings), the peak memory of the compiler
# processes and the binary sizes of the release set (app, updater, se, MCP
# launcher) with ThinLTO across all crates or Cargo's default (ThinLTO only
# inside each crate), and the throughput of the local `speed_task_`
# benchmarks with both settings. Run 41356400264 measured 1, 2 and 4 jobs.
# Changes nothing.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full pushed SHA to measure
        required: true
        type: string

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        setting:
          - { jobs: 4, lto: thin }
          - { jobs: 4, lto: "false" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: ${{ matrix.setting.jobs }}
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.setting.lto }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 8
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Release build of the release set, with timings and peak memory
        shell: pwsh
        timeout-minutes: 170
        working-directory: native
        run: |
          $ErrorActionPreference = "Stop"
          cargo fetch --locked
          $peak = 0L
          $started = Get-Date
          $build = Start-Process cargo -ArgumentList @("build", "--release", "--locked", "--bin", "smart_explorer", "--bin", "smart_explorer_updater", "--bin", "se", "--bin", "se-mcp-launcher", "--timings") -NoNewWindow -PassThru
          while (-not $build.HasExited) {
            $now = (Get-Process -Name rustc -ErrorAction SilentlyContinue | Measure-Object WorkingSet64 -Sum).Sum
            if ($now -gt $peak) { $peak = $now }
            Start-Sleep -Milliseconds 500
          }
          $build.WaitForExit()
          $minutes = ((Get-Date) - $started).TotalMinutes
          if ($build.ExitCode -ne 0) { throw "cargo build failed with $($build.ExitCode)." }
          $exe = if ($IsWindows) { ".exe" } else { "" }
          $sizes = foreach ($bin in @("smart_explorer", "smart_explorer_updater", "se", "se-mcp-launcher")) {
            "{0:N1}" -f ((Get-Item "target/release/$bin$exe").Length / 1MB)
          }
          $line = "| $env:RUNNER_OS | $env:CARGO_BUILD_JOBS | $env:CARGO_PROFILE_RELEASE_LTO | {0:N1} | {1:N2} | {2} |" -f $minutes, ($peak / 1GB), ($sizes -join " | ")
          "| OS | jobs | LTO | minutes | peak rustc GiB | app MiB | updater MiB | se MiB | launcher MiB |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|---|---|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
          $line >> $env:GITHUB_STEP_SUMMARY
          Write-Host $line

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ runner.os }}-j${{ matrix.setting.jobs }}-${{ matrix.setting.lto }}
          path: native/target/cargo-timings/cargo-timing.html
          if-no-files-found: warn
          retention-days: 14

  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        lto: [thin, "false"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: 4
      # Release library tests, as the measure part of
      # native/test-speed-setup-task.py builds them; only LTO differs.
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      SMART_EXPLORER_COPY_PASTE_TASK: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Local speed benchmarks, three repetitions each
        shell: pwsh
        timeout-minutes: 140
        working-directory: native
        run: |
          $ErrorActionPreference = "Stop"
          # Isolated app data, as native/test-speed-setup-task.py gives them.
          $profile = Join-Path $env:RUNNER_TEMP "bench-profile"
          foreach ($pair in @(@("XDG_DATA_HOME", "data"), @("XDG_CONFIG_HOME", "config"), @("XDG_CACHE_HOME", "cache"),
                              @("APPDATA", "appdata"), @("LOCALAPPDATA", "localappdata"))) {
            $dir = Join-Path $profile $pair[1]
            New-Item -ItemType Directory -Force $dir | Out-Null
            Set-Item -Path "env:$($pair[0])" -Value $dir
          }
          cargo test --release --workspace --exclude smart_explorer_android --exclude smart_explorer --lib --locked --no-run
          if ($LASTEXITCODE -ne 0) { throw "Building the library tests failed." }
          $names = @("speed_task_share_large_file_512m", "speed_task_share_small_files_4k",
                     "speed_task_vault_stream_throughput", "speed_task_zip_extract_throughput",
                     "speed_task_sync_local_first_run_throughput", "speed_task_local_large_overwrite")
          "| OS | LTO | case | repetition | metrics |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
          foreach ($name in $names) {
            foreach ($rep in 1..3) {
              # cargo reports on stderr; that must not stop the step.
              $ErrorActionPreference = "Continue"
              $output = cargo test --release --workspace --exclude smart_explorer_android --exclude smart_explorer --lib --locked -- --ignored $name --nocapture --test-threads=1 2>&1 | Out-String
              $code = $LASTEXITCODE
              $ErrorActionPreference = "Stop"
              if ($code -ne 0) { Write-Host $output; throw "$name failed with exit code $code." }
              foreach ($match in [regex]::Matches($output, '(?m)^BENCH (\S+) ([^\r\n]*)')) {
                $row = "| $env:RUNNER_OS | $env:CARGO_PROFILE_RELEASE_LTO | $($match.Groups[1].Value) | $rep | $($match.Groups[2].Value.Trim()) |"
                $row >> $env:GITHUB_STEP_SUMMARY
                Write-Host $row
              }
            }
          }

  bloat:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: What the desktop app and se consist of (largest crates)
        timeout-minutes: 110
        working-directory: native
        run: |
          set -euo pipefail
          cargo install cargo-bloat --locked
          for bin in smart_explorer se; do
            echo "### $bin" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cargo bloat --release --locked --bin "$bin" --crates -n 30 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

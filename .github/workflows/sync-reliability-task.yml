name: sync-reliability-task
run-name: Sync reliability ${{ inputs.candidate_sha }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full pushed main source SHA for the complete sync task batch
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sync-reliability-task-${{ github.repository }}
  cancel-in-progress: false
env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 1
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: never
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: linux
            os: ubuntu-24.04
          - stage: windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            share-server
          shared-key: rv1-native
          cache-on-failure: true
      - name: Prepare actual Linux protocol fixtures
        if: matrix.stage == 'linux'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n true
          sudo apt-get update
          sudo apt-get install -y openssh-client openssl smbclient apache2-utils libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0
          docker info >/dev/null
      - uses: actions/cache/restore@v4
        id: outputs
        with:
          path: |
            native/target
            share-server/target
            .review-task-cache
          key: rv1-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: rv1-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-
      - name: Run the one complete native task stage
        shell: bash
        timeout-minutes: 340
        env:
          SE_DRIVE_TEST_CLIENT_ID: ${{ matrix.stage == 'linux' && secrets.SE_DRIVE_TEST_CLIENT_ID || '' }}
          SE_DRIVE_TEST_CLIENT_SECRET: ${{ matrix.stage == 'linux' && secrets.SE_DRIVE_TEST_CLIENT_SECRET || '' }}
          SE_DRIVE_TEST_REFRESH_TOKEN: ${{ matrix.stage == 'linux' && secrets.SE_DRIVE_TEST_REFRESH_TOKEN || '' }}
        run: python native/test-sync-reliability-task.py --stage native --out "$RUNNER_TEMP/sync-reliability-bin"
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.outputs.outcome == 'success' }}
        with:
          path: |
            native/target
            share-server/target
            .review-task-cache
          key: ${{ steps.outputs.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-reliability-report-${{ matrix.stage }}-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sync-reliability-task/${{ matrix.stage }}/
            !${{ runner.temp }}/sync-reliability-task/${{ matrix.stage }}/native-profile/**
            !${{ runner.temp }}/sync-reliability-task/${{ matrix.stage }}/legacy-worker/c08-legacy-worker-*/**
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.stage == 'linux' }}
        with:
          name: sync-reliability-bin-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sync-reliability-bin/
          if-no-files-found: warn
          retention-days: 7
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      handoff_ready: ${{ steps.handoff.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: rv1-ndk
          cache-on-failure: true
      - uses: actions/cache/restore@v4
        id: outputs
        with:
          path: native/target
          key: rv1-android-${{ steps.rust.outputs.cachekey }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: rv1-android-${{ steps.rust.outputs.cachekey }}-
      - name: Prepare same-certificate development signing
        shell: bash
        env:
          KEYSTORE_BYTES: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -Eeuo pipefail
          test -n "$KEYSTORE_BYTES"
          umask 077
          printf '%s' "$KEYSTORE_BYTES" | base64 --decode > "$RUNNER_TEMP/sync-reliability.keystore"
      - name: Build the affected emulator bridge and APKs
        id: build
        shell: bash
        timeout-minutes: 220
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/sync-reliability.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python native/test-sync-reliability-task.py --stage android-build --out "$RUNNER_TEMP/sync-reliability-apks"
      - name: Remove the task signing file
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/sync-reliability.keystore"
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.outputs.outcome == 'success' }}
        with:
          path: native/target
          key: ${{ steps.outputs.outputs.cache-primary-key }}
      - id: handoff
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/sync-reliability-apks/provenance.json" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.handoff.outputs.ready == 'true' }}
        with:
          name: sync-reliability-apks-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sync-reliability-apks/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-reliability-report-android-build-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sync-reliability-task/android-build/
          if-no-files-found: error
          retention-days: 7
  device:
    needs: android-build
    if: ${{ always() && !cancelled() && needs.android-build.outputs.handoff_ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: sync-reliability-apks-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sync-reliability-apks
      - name: Enable KVM for the dedicated emulator
        shell: bash
        run: |
          sudo -n true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 160
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          disk-size: 8G
          sdcard-path-or-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python native/test-sync-reliability-task.py --stage device --apks "$RUNNER_TEMP/sync-reliability-apks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-reliability-report-device-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sync-reliability-task/device/
          if-no-files-found: error
          retention-days: 7
  evaluate:
    needs: [native, android-build, device]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: sync-reliability-report-*-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sync-reliability-reports
      - name: Evaluate the entire source-bound task contract
        run: python native/test-sync-reliability-task.py --stage evaluate --reports "$RUNNER_TEMP/sync-reliability-reports"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-reliability-acceptance-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sync-reliability-task/evaluate/
          if-no-files-found: error
          retention-days: 7

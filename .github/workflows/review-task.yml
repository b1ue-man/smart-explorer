name: review-task
# One exact candidate, one task-level suite; no release or competing check mode.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full pushed candidate SHA, matching the selected ref
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: review-task-${{ github.repository }}
  cancel-in-progress: false
env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 1
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: never
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      handoff_ready: ${{ steps.handoff.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            share-server
          shared-key: rv1-native
          cache-on-failure: true
      - name: Prepare the isolated Linux runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n true
          sudo apt-get update
          sudo apt-get install -y jq socat sshfs openssh-sftp-server dosfstools exfatprogs libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0
      - uses: actions/cache/restore@v4
        id: outputs
        with:
          path: |
            native/target
            share-server/target
            .review-task-cache
          key: rv1-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: rv1-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-
      - name: Run the complete native stage
        shell: bash
        timeout-minutes: 340
        run: bash native/test-review-task.sh --stage native --binary-cache "$GITHUB_WORKSPACE/.review-task-cache" --out "$RUNNER_TEMP/review-task-bin"
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.outputs.outcome == 'success' }}
        with:
          path: |
            native/target
            share-server/target
            .review-task-cache
          key: ${{ steps.outputs.outputs.cache-primary-key }}
      - name: Discover the source-bound device handoff
        id: handoff
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/review-task-bin/provenance.json" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.handoff.outputs.ready == 'true' }}
        with:
          name: review-task-bin-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/review-task-bin
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: review-task-linux-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-task-logs
          if-no-files-found: warn
          retention-days: 7
  windows:
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            share-server
          shared-key: rv1-native
          cache-on-failure: true
      - uses: actions/cache/restore@v4
        id: outputs
        with:
          path: |
            native/target
            share-server/target
            .review-task-cache
          key: rv1-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: rv1-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-
      - name: Run the complete native stage
        shell: bash
        timeout-minutes: 340
        run: bash native/test-review-task.sh --stage native --binary-cache "$GITHUB_WORKSPACE/.review-task-cache"
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.outputs.outcome == 'success' }}
        with:
          path: |
            native/target
            share-server/target
            .review-task-cache
          key: ${{ steps.outputs.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: review-task-windows-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-task-logs
          if-no-files-found: warn
          retention-days: 7
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      handoff_ready: ${{ steps.handoff.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: rv1-ndk
          cache-on-failure: true
      - uses: actions/cache/restore@v4
        id: outputs
        with:
          path: native/target
          key: rv1-android-${{ steps.rust.outputs.cachekey }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: rv1-android-${{ steps.rust.outputs.cachekey }}-
      - name: Build emulator JNI, APKs and affected JVM behavior
        shell: bash
        timeout-minutes: 220
        run: bash native/test-review-task.sh --stage android-build --out "$RUNNER_TEMP/review-task-apk"
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.outputs.outcome == 'success' }}
        with:
          path: native/target
          key: ${{ steps.outputs.outputs.cache-primary-key }}
      - id: handoff
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/review-task-apk/provenance.json" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.handoff.outputs.ready == 'true' }}
        with:
          name: review-task-apk-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/review-task-apk
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: review-task-android-build-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-task-logs
          if-no-files-found: warn
          retention-days: 7
  device:
    needs: [linux, android-build]
    if: ${{ always() && !cancelled() && needs.linux.outputs.handoff_ready == 'true' && needs.android-build.outputs.handoff_ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: review-task-apk-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/review-task-artifacts/apk
      - uses: actions/download-artifact@v4
        with:
          name: review-task-bin-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/review-task-artifacts/bin
      - name: Enable KVM for the isolated emulator
        shell: bash
        run: |
          sudo -n true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 340
        env:
          SE_TASK_ARTIFACTS: ${{ runner.temp }}/review-task-artifacts
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          disk-size: 8G
          sdcard-path-or-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash native/test-review-task.sh --stage device
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: review-task-device-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-task-logs
          if-no-files-found: warn
          retention-days: 7

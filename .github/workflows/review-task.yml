name: review-task

# Single task-level suite for the review batch RV1: remote analysis on the
# exporting host, sync reliability with OS-specific real-time watching, and
# Share security defaults
# (docs/superpowers/plans/2026-10-02-review-analyse-sync-sicherheit/). Dispatch
# it for the exact pushed candidate SHA; it never publishes anything.
#   check   narrow compile check while the batch is built: batch gates for the
#           host, the Windows target and the Share server (linux job) and the
#           Android Rust + Kotlin build (android-build job). No tests run.
#   suite   the complete task-level suite; its further jobs are added once the
#           batch is implemented.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to verify (must match the selected ref)
        required: true
        type: string
      mode:
        description: check (compile gates only) or suite (complete task-level suite)
        required: true
        default: check
        type: choice
        options:
          - check
          - suite

permissions:
  contents: read

concurrency:
  group: review-task-${{ github.repository }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the run to the exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          log_root="$RUNNER_TEMP/review-task-logs"
          mkdir -p "$log_root"
          printf 'SMART_EXPLORER_TASK_LOG_ROOT=%s\n' "$log_root" >> "$GITHUB_ENV"
          checked_out_sha="$(git rev-parse HEAD)"
          printf 'requested_sha=%s\nworkflow_sha=%s\nchecked_out_sha=%s\n' \
            "$CANDIDATE_SHA" "$GITHUB_SHA" "$checked_out_sha" \
            > "$log_root/candidate.txt"
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be one full 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA,,}" != "${GITHUB_SHA,,}" ]] || \
             [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Selected ref, requested candidate, and checked-out commit differ."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Install the Windows cross C toolchain and the suite tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y mingw-w64 jq
          x86_64-w64-mingw32-gcc --version | head -n 1
          jq --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            share-server
          cache-on-failure: true

      - name: Run the task-level suite
        shell: bash
        timeout-minutes: 160
        env:
          SUITE_MODE: ${{ inputs.mode }}
        run: |
          set -Eeuo pipefail
          arguments=(--direct)
          if [[ "$SUITE_MODE" == check ]]; then
            arguments+=(--check)
          fi
          bash native/test-review-task.sh "${arguments[@]}" 2>&1 | \
            tee "$SMART_EXPLORER_TASK_LOG_ROOT/suite.log"

      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: review-task-linux-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-task-logs
          if-no-files-found: warn
          retention-days: 7

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the run to the exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          log_root="$RUNNER_TEMP/android-task-logs"
          mkdir -p "$log_root"
          printf 'SMART_EXPLORER_TASK_LOG_ROOT=%s\n' "$log_root" >> "$GITHUB_ENV"
          checked_out_sha="$(git rev-parse HEAD)"
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be one full 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA,,}" != "${GITHUB_SHA,,}" ]] || \
             [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Selected ref, requested candidate, and checked-out commit differ."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: android-task-ndk
          cache-on-failure: true

      - name: Build and check the Android side
        shell: bash
        timeout-minutes: 140
        run: |
          set -Eeuo pipefail
          bash android/test-android-task.sh android-build --out "$RUNNER_TEMP/android-task-apk" 2>&1 | \
            tee "$SMART_EXPLORER_TASK_LOG_ROOT/suite-android-build.log"

      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: review-task-android-build-logs-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-task-logs

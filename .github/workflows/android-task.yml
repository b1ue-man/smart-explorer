name: android-task

# Single task-level suite of the Android APK batch
# (docs/superpowers/plans/2026-09-25-android-apk/umsetzung.md, Gesamtablauf G1–G7).
# Dispatch it once for the exact pushed candidate SHA; it never publishes anything. Every job
# calls exactly one sub-command of android/test-android-task.sh:
#   host          G1 android_task_ tests, G2 desktop unchanged (Linux + Windows-GNU), G7 static
#   desktop-bins  Linux `se` + `se-share-server` for the G5 Share check (artifact)
#   android-build G3 Android tree, NDK/cargo-ndk, .so + 16 KB, debug/test APKs, JVM tests (artifact)
#   device        G4/G5/G6 on an x86_64 emulator with SD card, SFTP/FTP containers, desktop Share
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to verify (must match the selected ref)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-task-${{ github.repository }}
  cancel-in-progress: false

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the run to the exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          log_root="$RUNNER_TEMP/android-task-logs"
          mkdir -p "$log_root"
          printf 'SMART_EXPLORER_TASK_LOG_ROOT=%s\n' "$log_root" >> "$GITHUB_ENV"
          checked_out_sha="$(git rev-parse HEAD)"
          printf 'requested_sha=%s\nworkflow_sha=%s\nchecked_out_sha=%s\n' \
            "$CANDIDATE_SHA" "$GITHUB_SHA" "$checked_out_sha" > "$log_root/candidate.txt"
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be one full 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA,,}" != "${GITHUB_SHA,,}" ]] || [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Selected ref, requested candidate, and checked-out commit differ."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Install the Windows cross C toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y mingw-w64 jq
          x86_64-w64-mingw32-gcc --version | head -n 1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: android-task-host
          cache-on-failure: true

      - name: Run the host part of the task suite (G1, G2, G7)
        shell: bash
        timeout-minutes: 170
        run: |
          set -Eeuo pipefail
          bash android/test-android-task.sh host 2>&1 | tee "$SMART_EXPLORER_TASK_LOG_ROOT/suite-host.log"

      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-task-host-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-task-logs

  desktop-bins:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the run to the exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          log_root="$RUNNER_TEMP/android-task-logs"
          mkdir -p "$log_root"
          printf 'SMART_EXPLORER_TASK_LOG_ROOT=%s\n' "$log_root" >> "$GITHUB_ENV"
          checked_out_sha="$(git rev-parse HEAD)"
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be one full 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA,,}" != "${GITHUB_SHA,,}" ]] || [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Selected ref, requested candidate, and checked-out commit differ."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            share-server
          shared-key: android-task-desktop-bins
          cache-on-failure: true

      - name: Build the desktop Share binaries (G5 prerequisites)
        shell: bash
        timeout-minutes: 80
        run: |
          set -Eeuo pipefail
          bash android/test-android-task.sh desktop-bins --out "$RUNNER_TEMP/android-task-bin" 2>&1 | \
            tee "$SMART_EXPLORER_TASK_LOG_ROOT/suite-desktop-bins.log"

      - name: Hand the binaries to the device job
        uses: actions/upload-artifact@v4
        with:
          # No attempt suffix: a re-run of only the device job still finds the handoff.
          name: android-task-bin-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/android-task-bin
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-task-desktop-bins-logs-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-task-logs

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the run to the exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          log_root="$RUNNER_TEMP/android-task-logs"
          mkdir -p "$log_root"
          printf 'SMART_EXPLORER_TASK_LOG_ROOT=%s\n' "$log_root" >> "$GITHUB_ENV"
          checked_out_sha="$(git rev-parse HEAD)"
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be one full 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA,,}" != "${GITHUB_SHA,,}" ]] || [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Selected ref, requested candidate, and checked-out commit differ."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: android-task-ndk
          cache-on-failure: true

      - name: Build and check the Android side (G3)
        shell: bash
        timeout-minutes: 140
        run: |
          set -Eeuo pipefail
          bash android/test-android-task.sh android-build --out "$RUNNER_TEMP/android-task-apk" 2>&1 | \
            tee "$SMART_EXPLORER_TASK_LOG_ROOT/suite-android-build.log"

      - name: Hand the APKs to the device job
        uses: actions/upload-artifact@v4
        with:
          # No attempt suffix: a re-run of only the device job still finds the handoff.
          name: android-task-apk-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/android-task-apk
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-task-android-build-logs-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-task-logs

  device:
    needs: [android-build, desktop-bins]
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the run to the exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          log_root="$RUNNER_TEMP/android-task-logs"
          mkdir -p "$log_root"
          printf 'SMART_EXPLORER_TASK_LOG_ROOT=%s\n' "$log_root" >> "$GITHUB_ENV"
          checked_out_sha="$(git rev-parse HEAD)"
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be one full 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA,,}" != "${GITHUB_SHA,,}" ]] || [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Selected ref, requested candidate, and checked-out commit differ."
            exit 1
          fi

      - name: Download the debug and test APKs
        uses: actions/download-artifact@v4
        with:
          name: android-task-apk-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/android-task-artifacts/apk

      - name: Download the desktop Share binaries
        uses: actions/download-artifact@v4
        with:
          name: android-task-bin-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/android-task-artifacts/bin

      - name: Enable KVM for the emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the device part of the task suite (G4, G5, G6)
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 190
        env:
          SE_TASK_ARTIFACTS: ${{ runner.temp }}/android-task-artifacts
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          disk-size: 8G
          sdcard-path-or-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The script input runs line by line in separate shells: exactly one command here.
          script: bash android/test-android-task.sh emulator-run

      - name: Upload screenshots, logcat, reports and coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-task-device-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-task-logs
          if-no-files-found: warn

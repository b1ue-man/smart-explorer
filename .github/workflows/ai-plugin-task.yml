name: ai-plugin-task
run-name: AI agent plugin (se mcp, se plugin, SSH exec) ${{ inputs.candidate_sha }}

# Single task-level suite of the 2026-10-12 AI agent plugin batch
# (docs/plaene/2026-10-12-ki-agenten-plugin/plan.md). Dispatch it once for the exact
# pushed candidate SHA; it never builds release artifacts or publishes anything.
#   suite    fmt, development build, unit tests, MCP end-to-end over both protocol
#            lifecycles, SSH/Share exec (Linux), real claude/codex CLIs, on Linux and Windows
#   android  Android tree (the native library must still build without the MCP server)
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full pushed candidate SHA, matching the selected ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-plugin-task-${{ github.repository }}
  cancel-in-progress: false

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # The fmt stage diffs the batch against its base commit.
          fetch-depth: 50
          persist-credentials: false

      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install the agent hosts whose plugin contracts the suite checks
        shell: bash
        run: npm install -g @anthropic-ai/claude-code@2.1.296 @openai/codex@0.162.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            share-server
          # Reuse the preceding host-library task's dependency/incremental output.
          shared-key: search-recursive-access
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Run the one task entrypoint
        shell: bash
        timeout-minutes: 290
        run: >-
          python native/test-ai-plugin-task.py
          --log-root "$RUNNER_TEMP/ai-plugin-task"

      - name: Preserve acceptance and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-plugin-${{ runner.os }}-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-plugin-task
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the run to the exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          log_root="$RUNNER_TEMP/android-task-logs"
          mkdir -p "$log_root"
          printf 'SMART_EXPLORER_TASK_LOG_ROOT=%s\n' "$log_root" >> "$GITHUB_ENV"
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: android-task-ndk
          cache-on-failure: true

      - name: Build and check the Android side (facade, screens, NDK library, JVM tests)
        shell: bash
        timeout-minutes: 170
        run: |
          set -Eeuo pipefail
          bash android/test-android-task.sh android-build --out "$RUNNER_TEMP/ai-plugin-apk" 2>&1 | \
            tee "$SMART_EXPLORER_TASK_LOG_ROOT/suite-android-build.log"

      - name: Preserve Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-plugin-android-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-task-logs
          if-no-files-found: warn
          retention-days: 14

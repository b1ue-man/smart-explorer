name: build

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.complete_release_source_sha != '' &&
      format('Complete release from {0}', inputs.complete_release_source_sha) ||
      github.event_name == 'workflow_dispatch' && inputs.publish_release == true &&
      format('Publish release candidate {0}', github.sha) ||
      github.event_name == 'workflow_dispatch' && inputs.verify_release_candidate == true &&
      format('Verify release candidate {0}', github.sha) ||
      format('{0} {1}', github.event_name, github.ref_name) }}

# Ordinary branch pushes and pull requests run development checks and disposable
# builds. Publication triggers only verify and publish the exact committed
# candidate bytes; they never rebuild or rerun the task-level suite. Heavyweight
# exact-candidate E2Es are reserved for explicit verification without a release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_release_candidate:
        description: Verify the exact committed candidate without publishing
        required: true
        default: false
        type: boolean
      publish_release:
        description: Publish the exact committed release candidate
        required: true
        default: false
        type: boolean
      complete_release_source_sha:
        description: Build and publish once from this exact main source SHA
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  complete-release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.complete_release_source_sha != ''
    runs-on: windows-2025
    timeout-minutes: 360
    concurrency:
      group: smart-explorer-complete-release
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Bind complete release to exact main source
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.complete_release_source_sha }}
          REQUESTED_PUBLISH: ${{ inputs.publish_release }}
          REQUESTED_VERIFY: ${{ inputs.verify_release_candidate }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Complete release dispatch must select the main branch; got '$env:GITHUB_REF'."
          }
          if ($env:REQUESTED_PUBLISH -eq "true" -or $env:REQUESTED_VERIFY -eq "true") {
            throw "complete_release_source_sha is mutually exclusive with publish_release and verify_release_candidate."
          }
          if ($env:EXPECTED_SOURCE_SHA -notmatch '^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$') {
            throw "complete_release_source_sha must be one full Git object ID."
          }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN) -or
              [string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
            throw "The complete release requires the job-scoped GitHub token."
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch origin/main." }
          $expected = $env:EXPECTED_SOURCE_SHA.ToLowerInvariant()
          $head = (git rev-parse 'HEAD^{commit}').Trim().ToLowerInvariant()
          $remoteMain = (git rev-parse 'refs/remotes/origin/main^{commit}').Trim().ToLowerInvariant()
          $eventSha = $env:GITHUB_SHA.ToLowerInvariant()
          if ($head -ne $expected -or $eventSha -ne $expected -or $remoteMain -ne $expected) {
            throw "Complete release source drift: input=$expected HEAD=$head event=$eventSha origin/main=$remoteMain."
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare Windows release tools
        shell: pwsh
        run: choco install strawberryperl nsis -y --no-progress

      - name: Select WSL1 before Ubuntu installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          wsl.exe --set-default-version 1
          if ($LASTEXITCODE -ne 0) { throw "Could not select WSL1 as the installation default." }

      - name: Prepare Ubuntu WSL1 release environment
        uses: Ubuntu/WSL/.github/actions/wsl-install@3b7a6b2a43af18aa541eeee1669ac27656630097
        with:
          distro: Ubuntu-24.04
          useStore: false

      - name: Prepare and preflight WSL release tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $distro = "Ubuntu-24.04"
          $verbose = @(wsl.exe --list --verbose 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect the WSL distributions installed by the pinned Ubuntu action."
          }
          $distroRows = @(
            foreach ($rawLine in $verbose) {
              $line = ([string]$rawLine -replace "`0", "").Trim()
              $line = ($line -replace '^\*\s*', '').Trim()
              $match = [regex]::Match(
                $line,
                '^(?<name>\S+)\s+.+?\s+(?<version>\d+)\s*$'
              )
              if ($match.Success -and $match.Groups['name'].Value -ceq $distro) {
                [pscustomobject]@{
                  Name = $match.Groups['name'].Value
                  Version = [int]$match.Groups['version'].Value
                }
              }
            }
          )
          if ($distroRows.Count -ne 1 -or $distroRows[0].Version -ne 1) {
            $observed = if ($distroRows.Count -eq 1) { $distroRows[0].Version } else { "missing-or-ambiguous" }
            throw "The pinned Ubuntu WSL action must install exactly one $distro distribution as WSL1; observed version: $observed."
          }
          wsl.exe --set-default $distro
          if ($LASTEXITCODE -ne 0) { throw "Could not make $distro the default WSL distribution." }
          $setup = @'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            build-essential ca-certificates curl file git musl-tools p7zip-full pkg-config \
            python3 xauth x11-utils xvfb libegl1 libgl1 libgl1-mesa-dri libx11-6 \
            libx11-xcb1 libxcursor1 libxi6 libxkbcommon0 libxkbcommon-x11-0 libxrandr2
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --profile minimal
          fi
          . /root/.cargo/env
          rustup component add rustfmt clippy
          command -v bash >/dev/null 2>&1 || { echo 'missing WSL release tool: bash' >&2; exit 1; }
          command -v cargo >/dev/null 2>&1 || { echo 'missing WSL release tool: cargo' >&2; exit 1; }
          command -v rustc >/dev/null 2>&1 || { echo 'missing WSL release tool: rustc' >&2; exit 1; }
          command -v rustup >/dev/null 2>&1 || { echo 'missing WSL release tool: rustup' >&2; exit 1; }
          command -v gcc >/dev/null 2>&1 || { echo 'missing WSL release tool: gcc' >&2; exit 1; }
          command -v musl-gcc >/dev/null 2>&1 || { echo 'missing WSL release tool: musl-gcc' >&2; exit 1; }
          command -v file >/dev/null 2>&1 || { echo 'missing WSL release tool: file' >&2; exit 1; }
          command -v git >/dev/null 2>&1 || { echo 'missing WSL release tool: git' >&2; exit 1; }
          command -v xvfb-run >/dev/null 2>&1 || { echo 'missing WSL release tool: xvfb-run' >&2; exit 1; }
          command -v xauth >/dev/null 2>&1 || { echo 'missing WSL release tool: xauth' >&2; exit 1; }
          command -v xwininfo >/dev/null 2>&1 || { echo 'missing WSL release tool: xwininfo' >&2; exit 1; }
          '@
          $setup = $setup -replace "`r", ""
          wsl.exe -d $distro -u root -- bash -lc $setup
          if ($LASTEXITCODE -ne 0) { throw "WSL release-tool setup or preflight failed." }

      - name: Run one complete release transaction
        shell: pwsh
        timeout-minutes: 330
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SMART_EXPLORER_COMPLETE_RELEASE_SOURCE_SHA: ${{ inputs.complete_release_source_sha }}
        run: >-
          pwsh ./native/publish-release-local.ps1
          -SkipLocalCliUpdate
          -PublicationTimeoutMinutes 180

  windows-native-tests:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.event.deleted != true &&
        startsWith(github.ref, 'refs/heads/') &&
        startsWith(github.ref, 'refs/heads/verify/v') == false &&
        startsWith(github.ref, 'refs/heads/release/v') == false &&
        (github.ref != 'refs/heads/main' ||
          endsWith(github.event.head_commit.message, '[release candidate]') == false))
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    env:
      CARGO_BUILD_JOBS: 2
      SMART_EXPLORER_E2E_TEST_NAMESPACE: github_actions
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            share-server

      - name: Native Windows library tests
        run: cargo test --lib --no-fail-fast -- --test-threads=1

      - name: Native Windows standalone se tests
        run: cargo test --test se_cli --no-fail-fast -- --test-threads=1

      - name: Build native Windows Share CLI E2E binaries
        run: |
          cargo build --bin se
          cargo build --manifest-path ..\share-server\Cargo.toml --bin se-share-server

      - name: Native Windows Share and Exec CLI E2E
        shell: powershell
        run: |
          $se = (Resolve-Path ".\target\debug\se.exe").Path
          .\test-share-lifecycle-e2e-windows.ps1 `
            -SeBinary $se `
            -PeerSeBinary $se `
            -ExactCandidateRole A

      - name: Native Windows Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Upload Windows debug peer fixture
        uses: actions/upload-artifact@v4
        with:
          name: smart-explorer-windows-debug-peer
          path: native/target/debug/se.exe
          if-no-files-found: error
          retention-days: 1

  windows-gnu:
    needs: windows-native-tests
    if: needs.windows-native-tests.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7

      - name: Install development cross-check dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          binutils file mingw-w64 p7zip-full python3-yaml xvfb xauth x11-utils libegl1 libgl1 libgl1-mesa-dri
          libx11-6 libx11-xcb1 libxcursor1 libxi6 libxkbcommon0
          libxkbcommon-x11-0 libxrandr2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            native/explorer-command
            share-server
            se-agent

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Format check
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path explorer-command/Cargo.toml --all -- --check
          cargo fmt --manifest-path ../share-server/Cargo.toml --all -- --check
          cargo fmt --manifest-path ../se-agent/Cargo.toml --all -- --check

      - name: Dependency audit
        run: |
          # quick-xml 0.39.2 is currently pulled through plist -> netdev -> iroh
          # and via Wayland build tooling. plist 1.9.0 pins quick-xml ^0.39.2;
          # remove these two ignores as soon as that path can move to >=0.41.0.
          cargo audit --file Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
          cargo audit --file explorer-command/Cargo.lock
          cargo audit --file ../share-server/Cargo.lock
          cargo audit --file ../se-agent/Cargo.lock

      - name: Check (windows target)
        run: cargo check --target x86_64-pc-windows-gnu

      - name: Tests (host, including se subprocess coverage)
        # One build job and one test thread keep memory bounded while exercising
        # the library, every binary harness, and native/tests/se_cli.rs.
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo test --all-targets --no-fail-fast -- --test-threads=1

      - name: Linux GUI disposable startup check
        run: |
          cargo build --bin smart_explorer
          ./test-linux-gui-startup.sh --runtime-only target/debug/smart_explorer

      - name: Compile test harness (windows target)
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo test --no-run --all-targets --target x86_64-pc-windows-gnu

      - name: Clippy
        run: |
          cargo clippy --target x86_64-pc-windows-gnu --bins -- -D warnings
          cargo clippy --manifest-path explorer-command/Cargo.toml --target x86_64-pc-windows-gnu --all-targets -- -D warnings
          cargo clippy --manifest-path ../share-server/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path ../se-agent/Cargo.toml --all-targets -- -D warnings

      - name: Build and verify embedded SSH agents
        working-directory: .
        run: |
          native/build-agent-bundles.sh
          if ! git diff --exit-code -- native/agent-bin; then
            echo "::error::Committed SSH-agent bundles are stale. Run native/build-agent-bundles.sh and commit native/agent-bin/."
            exit 1
          fi

      - name: Check context-menu COM DLL
        working-directory: native/explorer-command
        run: cargo check --target x86_64-pc-windows-gnu

      - name: Check share signaling/relay server
        working-directory: share-server
        run: |
          cargo check
          cargo check --target x86_64-pc-windows-gnu
          cargo test --no-run
          cargo build

      - name: End-to-end tracked Share lifecycle
        working-directory: .
        run: native/test-share-lifecycle-e2e.sh

  release-candidate:
    if: >-
      (github.event_name == 'push' && github.event.deleted != true &&
        startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.complete_release_source_sha == '' &&
        (inputs.publish_release == true ||
          (inputs.verify_release_candidate == true && inputs.publish_release != true))) ||
      (github.event_name == 'push' && github.event.deleted != true &&
        startsWith(github.ref, 'refs/heads/verify/v')) ||
      (github.event_name == 'push' && github.event.deleted != true &&
        startsWith(github.ref, 'refs/heads/release/v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stage.outputs.version }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install exact-candidate verification dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          binutils file mingw-w64 p7zip-full python3-yaml

      - name: Verify and stage exact committed release candidate
        id: stage
        # The locally built candidate is already committed. This job never
        # rebuilds or rewrites it; every published byte comes from that commit.
        run: |
          set -euo pipefail
          ver="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml does not contain a valid release version: '$ver'."
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Release candidate $GITHUB_SHA is not contained in origin/main. Push the exact candidate to main before publishing."
            exit 1
          fi
          tag_ref="refs/tags/v$ver"
          tag_lines="$(git ls-remote origin "$tag_ref" "$tag_ref^{}")"
          tag_commit="$(printf '%s\n' "$tag_lines" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
          if [ -z "$tag_commit" ]; then
            tag_commit="$(printf '%s\n' "$tag_lines" | awk -v ref="$tag_ref" '$2 == ref { print $1; exit }')"
          fi
          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Existing v$ver tag points to $tag_commit, not exact candidate $GITHUB_SHA. Tags are immutable; use the next patch version."
            exit 1
          fi
          feed="$(cat ../release-native/update-feed/version.txt 2>/dev/null || echo '')"
          if [ "$feed" != "$ver" ]; then
            echo "::error::Committed feed version.txt ($feed) != Cargo.toml ($ver). Run only native/publish-release-local.ps1 for a complete release."
            exit 1
          fi
          test -s ../release-native/update-feed/smart_explorer.exe
          test -s ../release-native/update-feed/smart_explorer_updater.exe
          test -s ../release-native/update-feed/se.exe
          test -s ../release-native/update-feed/smart_explorer.exe.sha256
          test -s ../release-native/update-feed/smart_explorer_updater.exe.sha256
          test -s ../release-native/update-feed/se.exe.sha256
          test -s ../release-native/update-feed/smart_explorer
          test -s ../release-native/update-feed/smart_explorer_updater
          test -s ../release-native/update-feed/se
          test -s ../release-native/update-feed/smart_explorer.sha256
          test -s ../release-native/update-feed/smart_explorer_updater.sha256
          test -s ../release-native/update-feed/se.sha256
          test -s ../release-native/update-feed/windows-build.manifest
          test -s "../release-native/Smart Explorer Setup $ver.exe"
          test -s "../release-native/Smart Explorer.exe"
          test -s "../release-native/Smart Explorer Updater.exe"
          test -s ../release-native/se.exe
          test -s ../release-native/share-server/se-share-server.exe
          test -s ../release-native/share-server/se-share-server-linux
          test -s ../release-native/smart_explorer_command.dll
          test -x ../install-linux.sh
          reported_linux_se="$(../release-native/update-feed/se --version)"
          if [ "$reported_linux_se" != "se $ver" ]; then
            echo "::error::Committed Linux se version mismatch: $reported_linux_se"
            exit 1
          fi
          cmp ../release-native/update-feed/smart_explorer.exe "../release-native/Smart Explorer.exe"
          cmp ../release-native/update-feed/smart_explorer_updater.exe "../release-native/Smart Explorer Updater.exe"
          cmp ../release-native/update-feed/se.exe ../release-native/se.exe
          installer="../release-native/Smart Explorer Setup $ver.exe"
          installer_root="$(mktemp -d)"
          trap 'rm -rf "$installer_root"' EXIT
          7z e -y -o"$installer_root" "$installer" \
            "Smart Explorer.exe" "Smart Explorer Updater.exe" se.exe >/dev/null
          cmp "$installer_root/Smart Explorer.exe" ../release-native/update-feed/smart_explorer.exe
          cmp "$installer_root/Smart Explorer Updater.exe" ../release-native/update-feed/smart_explorer_updater.exe
          cmp "$installer_root/se.exe" ../release-native/update-feed/se.exe
          rm -rf "$installer_root"
          trap - EXIT
          (
            cd ../release-native/update-feed
            sha256sum -c smart_explorer.exe.sha256
            sha256sum -c smart_explorer_updater.exe.sha256
            sha256sum -c se.exe.sha256
            sha256sum -c smart_explorer.sha256
            sha256sum -c smart_explorer_updater.sha256
            sha256sum -c se.sha256
            for payload in \
              smart_explorer.exe smart_explorer_updater.exe se.exe \
              smart_explorer smart_explorer_updater se; do
              expected="$(awk 'NR == 1 { print $1 }' "$payload.sha256")"
              actual="$(sha256sum "$payload" | awk '{ print $1 }')"
              if ! [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || [[ "${expected,,}" != "$actual" ]]; then
                echo "::error::$payload.sha256 does not bind the exact $payload bytes."
                exit 1
              fi
            done
          )
          manifest=../release-native/update-feed/windows-build.manifest
          candidate_subject="$(git show -s --format=%s "$GITHUB_SHA")"
          if [ "$candidate_subject" != "Release Smart Explorer v$ver [release candidate]" ]; then
            echo "::error::Exact candidate commit has unexpected subject: $candidate_subject"
            exit 1
          fi
          read -r -a candidate_parents <<<"$(git show -s --format=%P "$GITHUB_SHA")"
          if [ "${#candidate_parents[@]}" -ne 1 ]; then
            echo "::error::Exact release candidate must have one source parent."
            exit 1
          fi
          source_commit="${candidate_parents[0]}"
          declare -A allowed_release_change=()
          for path in \
            native/Cargo.toml native/Cargo.lock \
            native/agent-bin/se-agent-x86_64-linux-musl \
            native/agent-bin/se-agent-aarch64-linux-musl \
            "release-native/Smart Explorer Setup $ver.exe" \
            "release-native/Smart Explorer.exe" \
            "release-native/Smart Explorer Updater.exe" \
            release-native/se.exe \
            release-native/smart_explorer_command.dll \
            release-native/share-server/se-share-server.exe \
            release-native/share-server/se-share-server-linux \
            release-native/update-feed/smart_explorer.exe \
            release-native/update-feed/smart_explorer_updater.exe \
            release-native/update-feed/se.exe \
            release-native/update-feed/smart_explorer.exe.sha256 \
            release-native/update-feed/smart_explorer_updater.exe.sha256 \
            release-native/update-feed/se.exe.sha256 \
            release-native/update-feed/smart_explorer \
            release-native/update-feed/smart_explorer_updater \
            release-native/update-feed/se \
            release-native/update-feed/smart_explorer.sha256 \
            release-native/update-feed/smart_explorer_updater.sha256 \
            release-native/update-feed/se.sha256 \
            release-native/update-feed/windows-build.manifest \
            release-native/update-feed/version.txt; do
            allowed_release_change["$path"]=1
          done
          changed_count=0
          while IFS= read -r changed; do
            [ -z "$changed" ] && continue
            ((changed_count += 1))
            if [[ -z "${allowed_release_change[$changed]+present}" ]]; then
              echo "::error::Release candidate commit contains non-release source change: $changed"
              exit 1
            fi
          done < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          if [ "$changed_count" -eq 0 ]; then
            echo "::error::Release candidate commit contains no release publication changes."
            exit 1
          fi
          if [[ "$(tr -d '\r' < "$manifest" | grep -Fxc "source_commit=$source_commit")" != 1 ]]; then
            echo "::error::Committed Windows build manifest does not bind source parent $source_commit."
            exit 1
          fi
          if [[ "$(awk -F= '$1 == "version" { count++; value=substr($0, index($0, "=") + 1) } END { sub(/\r$/, "", value); if (count != 1) exit 1; print value }' "$manifest")" != "$ver" ]]; then
            echo "::error::Committed Windows build manifest does not bind version $ver."
            exit 1
          fi
          for payload in smart_explorer.exe smart_explorer_updater.exe se.exe; do
            hash="$(sha256sum "../release-native/update-feed/$payload" | awk '{print $1}')"
            if [[ "$(tr -d '\r' < "$manifest" | grep -Fxc "$payload=$hash")" != 1 ]]; then
              echo "::error::Committed Windows build manifest does not bind $payload."
              exit 1
            fi
          done
          if [[ "$(awk 'NF { count++ } END { print count + 0 }' "$manifest")" != 5 ]]; then
            echo "::error::Windows build manifest must contain exactly version, source_commit, and three hashes."
            exit 1
          fi
          file ../release-native/update-feed/smart_explorer | grep -Fq 'dynamically linked'
          file ../release-native/update-feed/smart_explorer_updater | grep -Eq 'statically linked|static-pie linked'
          file ../release-native/update-feed/se | grep -Eq 'statically linked|static-pie linked'
          file ../release-native/share-server/se-share-server-linux | grep -Eq 'statically linked|static-pie linked'
          dll_headers="$(x86_64-w64-mingw32-objdump -p ../release-native/smart_explorer_command.dll)"
          grep -Fq DllGetClassObject <<<"$dll_headers"
          grep -Fq DllCanUnloadNow <<<"$dll_headers"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "${GITHUB_REF_NAME#v}" != "$ver" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $ver."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            branch_ver="${GITHUB_REF_NAME##*/}"
            branch_ver="${branch_ver#v}"
            if [[ "$branch_ver" != "$ver" ]]; then
              echo "::error::Release branch $GITHUB_REF_NAME does not match Cargo.toml version $ver."
              exit 1
            fi
          fi
          if [[ "$GITHUB_REF" == refs/heads/verify/v* ]]; then
            branch_ver="${GITHUB_REF_NAME##*/}"
            branch_ver="${branch_ver#v}"
            if [[ "$branch_ver" != "$ver" ]]; then
              echo "::error::Verification branch $GITHUB_REF_NAME does not match Cargo.toml version $ver."
              exit 1
            fi
          fi
          mkdir -p out
          for asset in \
            smart_explorer.exe smart_explorer_updater.exe se.exe \
            smart_explorer.exe.sha256 smart_explorer_updater.exe.sha256 se.exe.sha256 \
            smart_explorer smart_explorer_updater se \
            smart_explorer.sha256 smart_explorer_updater.sha256 se.sha256 \
            version.txt; do
            cp "../release-native/update-feed/$asset" "out/$asset"
          done
          cp "../release-native/Smart Explorer Setup $ver.exe" "out/Smart Explorer Setup $ver.exe"
          cp ../release-native/smart_explorer_command.dll out/smart_explorer_command.dll
          cp ../release-native/share-server/se-share-server.exe out/se-share-server.exe
          cp ../release-native/share-server/se-share-server-linux out/se-share-server-linux
          cp ../install-linux.sh out/install-linux.sh
          staged_count="$(find out -maxdepth 1 -type f -printf '.' | wc -c)"
          if [ "$staged_count" -ne 18 ]; then
            echo "::error::Staged release candidate contains $staged_count files, expected exactly 18."
            exit 1
          fi
          echo "Committed feed and release assets match Cargo.toml ($ver); out/ now contains the verified committed bytes."

      - name: Exact committed Linux Share and Exec CLI E2E
        if: >-
          (github.event_name == 'workflow_dispatch' &&
            inputs.verify_release_candidate == true && inputs.publish_release != true) ||
          (github.event_name == 'push' && github.event.deleted != true &&
            startsWith(github.ref, 'refs/heads/verify/v'))
        working-directory: .
        env:
          SMART_EXPLORER_SE_BINARY: ${{ github.workspace }}/release-native/update-feed/se
          SMART_EXPLORER_SHARE_SERVER_BINARY: ${{ github.workspace }}/release-native/share-server/se-share-server-linux
          SMART_EXPLORER_E2E_TEST_NAMESPACE: github_actions_linux_release
        run: native/test-share-lifecycle-e2e.sh

      - name: Exact committed Linux mixed-version Share E2E
        if: >-
          (github.event_name == 'workflow_dispatch' &&
            inputs.verify_release_candidate == true && inputs.publish_release != true) ||
          (github.event_name == 'push' && github.event.deleted != true &&
            startsWith(github.ref, 'refs/heads/verify/v'))
        working-directory: .
        env:
          SMART_EXPLORER_SE_BINARY: ${{ github.workspace }}/release-native/update-feed/se
          SMART_EXPLORER_SHARE_SERVER_BINARY: ${{ github.workspace }}/release-native/share-server/se-share-server-linux
        run: |
          legacy="$RUNNER_TEMP/se-0.5.126"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$legacy" \
            https://github.com/b1ue-man/smart-explorer/releases/download/v0.5.126/se
          printf '%s  %s\n' \
            c0868ff4609dc9a134fa96a7aadeb5e8612adc4546a661a85e1c11879936c573 \
            "$legacy" | sha256sum --check --strict
          chmod 0755 "$legacy"
          SMART_EXPLORER_LEGACY_SE_BINARY="$legacy" \
            native/test-share-mixed-version-e2e.sh

      - name: Upload exact staged release candidate
        uses: actions/upload-artifact@v4
        with:
          name: smart-explorer-builds
          path: native/out
          overwrite: true

  windows-gnu-release-e2e:
    needs: release-candidate
    if: >-
      always() && needs.release-candidate.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' &&
          inputs.verify_release_candidate == true && inputs.publish_release != true) ||
        (github.event_name == 'push' && github.event.deleted != true &&
          startsWith(github.ref, 'refs/heads/verify/v')))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: smart-explorer-builds
          path: release-candidate

      - name: Verify downloaded candidate bytes and CLI versions
        shell: powershell
        run: |
          $version = "${{ needs.release-candidate.outputs.version }}"
          $assetMappings = @(
            [pscustomobject]@{ Source = ".\release-native\Smart Explorer Setup $version.exe"; Staged = ".\release-candidate\Smart Explorer Setup $version.exe" },
            [pscustomobject]@{ Source = ".\release-native\update-feed\smart_explorer.exe"; Staged = ".\release-candidate\smart_explorer.exe" },
            [pscustomobject]@{ Source = ".\release-native\update-feed\smart_explorer_updater.exe"; Staged = ".\release-candidate\smart_explorer_updater.exe" },
            [pscustomobject]@{ Source = ".\release-native\update-feed\se.exe"; Staged = ".\release-candidate\se.exe" },
            [pscustomobject]@{ Source = ".\release-native\update-feed\smart_explorer.exe.sha256"; Staged = ".\release-candidate\smart_explorer.exe.sha256" },
            [pscustomobject]@{ Source = ".\release-native\update-feed\smart_explorer_updater.exe.sha256"; Staged = ".\release-candidate\smart_explorer_updater.exe.sha256" },
            [pscustomobject]@{ Source = ".\release-native\update-feed\se.exe.sha256"; Staged = ".\release-candidate\se.exe.sha256" },
            [pscustomobject]@{ Source = ".\release-native\update-feed\smart_explorer"; Staged = ".\release-candidate\smart_explorer" },
            [pscustomobject]@{ Source = ".\release-native\update-feed\smart_explorer_updater"; Staged = ".\release-candidate\smart_explorer_updater" },
            [pscustomobject]@{ Source = ".\release-native\update-feed\se"; Staged = ".\release-candidate\se" },
            [pscustomobject]@{ Source = ".\release-native\update-feed\smart_explorer.sha256"; Staged = ".\release-candidate\smart_explorer.sha256" },
            [pscustomobject]@{ Source = ".\release-native\update-feed\smart_explorer_updater.sha256"; Staged = ".\release-candidate\smart_explorer_updater.sha256" },
            [pscustomobject]@{ Source = ".\release-native\update-feed\se.sha256"; Staged = ".\release-candidate\se.sha256" },
            [pscustomobject]@{ Source = ".\install-linux.sh"; Staged = ".\release-candidate\install-linux.sh" },
            [pscustomobject]@{ Source = ".\release-native\smart_explorer_command.dll"; Staged = ".\release-candidate\smart_explorer_command.dll" },
            [pscustomobject]@{ Source = ".\release-native\share-server\se-share-server.exe"; Staged = ".\release-candidate\se-share-server.exe" },
            [pscustomobject]@{ Source = ".\release-native\share-server\se-share-server-linux"; Staged = ".\release-candidate\se-share-server-linux" },
            [pscustomobject]@{ Source = ".\release-native\update-feed\version.txt"; Staged = ".\release-candidate\version.txt" }
          )
          $stagedFiles = @([System.IO.Directory]::EnumerateFiles(
            (Resolve-Path ".\release-candidate").Path,
            "*",
            [System.IO.SearchOption]::AllDirectories
          ))
          if ($assetMappings.Count -ne 18 -or $stagedFiles.Count -ne 18) {
            throw "release candidate must contain exactly 18 mapped assets; mapped=$($assetMappings.Count), downloaded=$($stagedFiles.Count)"
          }
          $mappedSources = @{}
          $mappedStaged = @{}
          foreach ($mapping in $assetMappings) {
            $source = (Resolve-Path -LiteralPath $mapping.Source -ErrorAction Stop).Path
            $staged = (Resolve-Path -LiteralPath $mapping.Staged -ErrorAction Stop).Path
            if ($mappedSources.ContainsKey($source) -or $mappedStaged.ContainsKey($staged)) {
              throw "release candidate mapping contains a duplicate source or destination: $source -> $staged"
            }
            $mappedSources[$source] = $true
            $mappedStaged[$staged] = $true
            & "$env:SystemRoot\System32\fc.exe" /b $source $staged > $null
            if ($LASTEXITCODE -ne 0) {
              throw "downloaded candidate differs from committed source: $($mapping.Staged)"
            }
          }
          $se = (Resolve-Path ".\release-candidate\se.exe").Path
          $reported = (& $se --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $reported -ne "se $version") {
            throw "staged se version mismatch: '$reported'"
          }

      - name: Exact staged Windows GNU Share and Exec CLI E2E in both roles
        shell: powershell
        run: |
          $se = (Resolve-Path ".\release-candidate\se.exe").Path
          $server = (Resolve-Path ".\release-candidate\se-share-server.exe").Path
          .\native\test-share-lifecycle-e2e-windows.ps1 `
            -SeBinary $se `
            -PeerSeBinary $se `
            -ExactCandidateRole A `
            -ShareServerBinary $server
          .\native\test-share-lifecycle-e2e-windows.ps1 `
            -SeBinary $se `
            -PeerSeBinary $se `
            -ExactCandidateRole B `
            -ShareServerBinary $server

  publish-release:
    needs: release-candidate
    if: >-
      always() && needs.release-candidate.result == 'success' &&
      ((github.event_name == 'push' && github.event.deleted != true &&
          startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) ||
        (github.event_name == 'push' && github.event.deleted != true &&
          startsWith(github.ref, 'refs/heads/release/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: smart-explorer-builds
          path: native/out

      - name: Reverify downloaded release bytes before publication
        shell: bash
        run: |
          set -euo pipefail
          ver='${{ needs.release-candidate.outputs.version }}'
          asset_mappings=(
            "release-native/Smart Explorer Setup $ver.exe|native/out/Smart Explorer Setup $ver.exe"
            "release-native/update-feed/smart_explorer.exe|native/out/smart_explorer.exe"
            "release-native/update-feed/smart_explorer_updater.exe|native/out/smart_explorer_updater.exe"
            "release-native/update-feed/se.exe|native/out/se.exe"
            "release-native/update-feed/smart_explorer.exe.sha256|native/out/smart_explorer.exe.sha256"
            "release-native/update-feed/smart_explorer_updater.exe.sha256|native/out/smart_explorer_updater.exe.sha256"
            "release-native/update-feed/se.exe.sha256|native/out/se.exe.sha256"
            "release-native/update-feed/smart_explorer|native/out/smart_explorer"
            "release-native/update-feed/smart_explorer_updater|native/out/smart_explorer_updater"
            "release-native/update-feed/se|native/out/se"
            "release-native/update-feed/smart_explorer.sha256|native/out/smart_explorer.sha256"
            "release-native/update-feed/smart_explorer_updater.sha256|native/out/smart_explorer_updater.sha256"
            "release-native/update-feed/se.sha256|native/out/se.sha256"
            "install-linux.sh|native/out/install-linux.sh"
            "release-native/smart_explorer_command.dll|native/out/smart_explorer_command.dll"
            "release-native/share-server/se-share-server.exe|native/out/se-share-server.exe"
            "release-native/share-server/se-share-server-linux|native/out/se-share-server-linux"
            "release-native/update-feed/version.txt|native/out/version.txt"
          )
          if [ "${#asset_mappings[@]}" -ne 18 ]; then
            echo "::error::Internal release mapping does not contain exactly 18 assets."
            exit 1
          fi
          downloaded_count="$(find native/out -type f -printf '.' | wc -c)"
          if [ "$downloaded_count" -ne 18 ]; then
            echo "::error::Downloaded release candidate contains $downloaded_count files, expected exactly 18."
            exit 1
          fi
          declare -A mapped_committed=()
          declare -A mapped_staged=()
          for mapping in "${asset_mappings[@]}"; do
            IFS='|' read -r committed staged <<<"$mapping"
            if [ ! -f "$committed" ] || [ ! -f "$staged" ]; then
              echo "::error::Release asset mapping is missing a file: $committed -> $staged"
              exit 1
            fi
            if [[ -n "${mapped_committed[$committed]+present}" ]] ||
              [[ -n "${mapped_staged[$staged]+present}" ]]; then
              echo "::error::Release asset mapping contains a duplicate source or destination: $committed -> $staged"
              exit 1
            fi
            mapped_committed["$committed"]=1
            mapped_staged["$staged"]=1
            if ! cmp "$committed" "$staged"; then
              echo "::error::Downloaded release asset differs from the committed source: $staged"
              exit 1
            fi
          done
          (
            cd native/out
            sha256sum --check --strict smart_explorer.exe.sha256
            sha256sum --check --strict smart_explorer_updater.exe.sha256
            sha256sum --check --strict se.exe.sha256
            sha256sum --check --strict smart_explorer.sha256
            sha256sum --check --strict smart_explorer_updater.sha256
            sha256sum --check --strict se.sha256
          )

      - name: Bind publication to exact main commit and immutable tag
        shell: bash
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${{ needs.release-candidate.outputs.version }}"
          tag="v$ver"
          tag_ref="refs/tags/$tag"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tested candidate $GITHUB_SHA is not contained in origin/main."
            exit 1
          fi
          remote_tag_commit() {
            local lines peeled direct
            lines="$(git ls-remote origin "$tag_ref" "$tag_ref^{}")"
            peeled="$(printf '%s\n' "$lines" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
            if [ -n "$peeled" ]; then
              printf '%s\n' "$peeled"
              return
            fi
            direct="$(printf '%s\n' "$lines" | awk -v ref="$tag_ref" '$2 == ref { print $1; exit }')"
            printf '%s\n' "$direct"
          }
          existing="$(remote_tag_commit)"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::Existing $tag points to $existing, not verified candidate $GITHUB_SHA. Refusing to rewrite it or replace its assets."
            exit 1
          fi
          if [ -z "$existing" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Tag-triggered publication cannot find its immutable remote tag $tag."
              exit 1
            fi
            response_file="$(mktemp)"
            trap 'rm -f "$response_file"' EXIT
            payload="$(printf '{"ref":"refs/tags/%s","sha":"%s"}' "$tag" "$GITHUB_SHA")"
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $RELEASE_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs" \
              --data "$payload")"
            if [ "$status" != 201 ] && [ "$status" != 422 ]; then
              echo "::error::GitHub API could not create immutable $tag at $GITHUB_SHA (HTTP $status)."
              sed -n '1,20p' "$response_file"
              exit 1
            fi
            rm -f "$response_file"
            trap - EXIT
          fi
          final="$(remote_tag_commit)"
          if [ "$final" != "$GITHUB_SHA" ]; then
            echo "::error::$tag is not bound to verified candidate $GITHUB_SHA immediately before publication."
            exit 1
          fi

      - name: Publish GitHub Release
        # Publication consumes only the statically verified committed bytes.
        # Fallback tag creation uses this workflow's token and therefore does
        # not enqueue a competing tag-triggered workflow.
        uses: softprops/action-gh-release@v2
        with:
          # Every path reaches this step with the immutable tag already bound.
          tag_name: v${{ needs.release-candidate.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Smart Explorer ${{ needs.release-candidate.outputs.version }}
          fail_on_unmatched_files: true
          body: |
            **Smart Explorer ${{ needs.release-candidate.outputs.version }}** — Windows x64 and Linux x86_64 desktop builds.

            Linux one-line install:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/b1ue-man/smart-explorer/main/install-linux.sh | sh
            ```

            - **Smart Explorer Setup ${{ needs.release-candidate.outputs.version }}.exe** —
              installer (recommended). Sets up auto-update from the Git feed and
              the right-click "In Smart Explorer öffnen" verb.
            - **smart_explorer.exe** — portable app (also the self-update
              payload). For auto-update, set the update source to this repo's URL
              in the app (Sidebar → UPDATE), or use the installer.
            - **se.exe** / **se** — terminal companion for saved remote and
              Smart Explorer peer operations.
            - **smart_explorer_command.dll** — Win11 modern context-menu
              IExplorerCommand handler (needs signing to register; see
              `docs/WIN11_CONTEXT_MENU.md`).
            - **smart_explorer** / **smart_explorer_updater** — Linux x86_64
              desktop app and updater payloads used by the one-line installer.
            - **se-share-server.exe** / **se-share-server-linux** —
              standalone signaling server plus Iroh encrypted-traffic relay for
              direct peer sharing.

            Built once by the local complete release workflow and published
            from the exact committed candidate. Update + release flow:
            `docs/RELEASING.md`.
          files: |
            native/out/Smart Explorer Setup ${{ needs.release-candidate.outputs.version }}.exe
            native/out/smart_explorer.exe
            native/out/smart_explorer_updater.exe
            native/out/se.exe
            native/out/smart_explorer.exe.sha256
            native/out/smart_explorer_updater.exe.sha256
            native/out/se.exe.sha256
            native/out/smart_explorer
            native/out/smart_explorer_updater
            native/out/se
            native/out/smart_explorer.sha256
            native/out/smart_explorer_updater.sha256
            native/out/se.sha256
            native/out/install-linux.sh
            native/out/smart_explorer_command.dll
            native/out/se-share-server.exe
            native/out/se-share-server-linux
            native/out/version.txt

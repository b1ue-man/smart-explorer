name: build

# Builds the Windows release on every push using the SAME cross-compile path
# that is verified locally (ubuntu + mingw-w64 + x86_64-pc-windows-gnu). This is
# the "build a release for each commit" gate. It publishes a GitHub Release
# (carrying the exe + the context-menu DLL) on a version tag (v*) OR on a manual
# `workflow_dispatch` — the latter creates the tag at the dispatched commit, so
# releases can be cut even where the git host doesn't accept tag pushes.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-gnu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 linker + NSIS (installer)
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nsis

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            native/explorer-command
            share-server
            se-agent

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Format check
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path explorer-command/Cargo.toml --all -- --check
          cargo fmt --manifest-path ../share-server/Cargo.toml --all -- --check
          cargo fmt --manifest-path ../se-agent/Cargo.toml --all -- --check

      - name: Dependency audit
        run: |
          # quick-xml 0.39.2 is currently pulled through plist -> netdev -> iroh
          # and via Wayland build tooling. plist 1.9.0 pins quick-xml ^0.39.2;
          # remove these two ignores as soon as that path can move to >=0.41.0.
          cargo audit --file Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
          cargo audit --file explorer-command/Cargo.lock
          cargo audit --file ../share-server/Cargo.lock
          cargo audit --file ../se-agent/Cargo.lock

      - name: Check (windows target)
        run: cargo check --target x86_64-pc-windows-gnu

      - name: Unit tests (host)
        # The crate is host-buildable (rfd xdg-portal on non-Windows), so the
        # full unit-test suite runs here — no display needed.
        run: cargo test --bin smart_explorer

      - name: Compile test harness (windows target)
        run: cargo test --no-run --bin smart_explorer --target x86_64-pc-windows-gnu

      - name: Clippy
        run: |
          cargo clippy --target x86_64-pc-windows-gnu --bins -- -D warnings
          cargo clippy --manifest-path explorer-command/Cargo.toml --target x86_64-pc-windows-gnu --all-targets -- -D warnings
          cargo clippy --manifest-path ../share-server/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path ../se-agent/Cargo.toml --all-targets -- -D warnings

      - name: Build and verify embedded SSH agents
        working-directory: .
        run: |
          native/build-agent-bundles.sh
          if ! git diff --exit-code -- native/agent-bin; then
            echo "::error::Committed SSH-agent bundles are stale. Run native/build-agent-bundles.sh and commit native/agent-bin/."
            exit 1
          fi

      - name: Check context-menu COM DLL
        working-directory: native/explorer-command
        run: cargo check --target x86_64-pc-windows-gnu

      - name: Check share signaling/relay server
        working-directory: share-server
        run: |
          cargo check
          cargo check --target x86_64-pc-windows-gnu
          cargo test --no-run

      - name: Release build
        run: |
          cargo build --release --target x86_64-pc-windows-gnu --bin smart_explorer --bin smart_explorer_updater --bin se
          mkdir -p out
          SMART_EXPLORER_FEED_DIR="$PWD/out" \
          SMART_EXPLORER_SHARE_DIR="$PWD/out" \
            ./publish-linux-feed-wsl.sh

      - name: Build context-menu COM DLL
        working-directory: native/explorer-command
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Build share signaling/relay server
        working-directory: share-server
        run: cargo build --release --target x86_64-pc-windows-gnu --bin se-share-server

      - name: Stage feed + build installer
        id: stage
        run: |
          mkdir -p out
          cp "target/x86_64-pc-windows-gnu/release/smart_explorer.exe" "out/smart_explorer.exe"
          cp "target/x86_64-pc-windows-gnu/release/smart_explorer_updater.exe" "out/smart_explorer_updater.exe"
          cp "target/x86_64-pc-windows-gnu/release/se.exe" "out/se.exe"
          cp "../install-linux.sh" "out/install-linux.sh"
          cp "explorer-command/target/x86_64-pc-windows-gnu/release/smart_explorer_command.dll" "out/smart_explorer_command.dll"
          cp "../share-server/target/x86_64-pc-windows-gnu/release/se-share-server.exe" "out/se-share-server.exe"
          ver=$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)
          ( cd out
            sha256sum smart_explorer.exe > smart_explorer.exe.sha256
            sha256sum smart_explorer_updater.exe > smart_explorer_updater.exe.sha256
            sha256sum se.exe > se.exe.sha256
            sha256sum smart_explorer > smart_explorer.sha256
            sha256sum smart_explorer_updater > smart_explorer_updater.sha256
            sha256sum se > se.sha256
          )
          {
            printf 'version=%s\n' "$ver"
            for payload in smart_explorer.exe smart_explorer_updater.exe se.exe; do
              printf '%s=%s\n' "$payload" "$(sha256sum "out/$payload" | awk '{print $1}')"
            done
          } > out/windows-build.manifest
          file out/smart_explorer | grep -Eq 'statically linked|static-pie linked'
          file out/se-share-server-linux | grep -Eq 'statically linked|static-pie linked'
          printf '%s\n' "$ver" > out/version.txt
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # NSIS installer (per-user; sets the Git update source + context menu).
          makensis -DVERSION="$ver" -DEXE_SRC="target/x86_64-pc-windows-gnu/release/smart_explorer.exe" -DUPDATER_SRC="target/x86_64-pc-windows-gnu/release/smart_explorer_updater.exe" -DCLI_SRC="target/x86_64-pc-windows-gnu/release/se.exe" -DINSTALLER_OUT="$PWD/out/Smart Explorer Setup $ver.exe" installer.nsi
          echo "Built version $ver (Windows exe/updater/se + Linux desktop binaries/se + dll + installer)"

      - uses: actions/upload-artifact@v4
        with:
          name: smart-explorer-builds
          path: native/out

      - name: Verify committed feed matches the version (release only)
        # The flow guarantee: a release can't go out while the committed feed
        # (what installed apps auto-update from) lags Cargo.toml. Forces
        # "run publish-feed.sh + commit release-native/" before releasing.
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/heads/release/')
        run: |
          ver="${{ steps.stage.outputs.version }}"
          feed="$(cat ../release-native/update-feed/version.txt 2>/dev/null || echo '')"
          if [ "$feed" != "$ver" ]; then
            echo "::error::Committed feed version.txt ($feed) != Cargo.toml ($ver). Run native/publish-feed.sh on a Linux/WSL host and commit release-native/ before releasing."
            exit 1
          fi
          test -s ../release-native/update-feed/smart_explorer.exe
          test -s ../release-native/update-feed/smart_explorer_updater.exe
          test -s ../release-native/update-feed/se.exe
          test -s ../release-native/update-feed/smart_explorer.exe.sha256
          test -s ../release-native/update-feed/smart_explorer_updater.exe.sha256
          test -s ../release-native/update-feed/se.exe.sha256
          test -s ../release-native/update-feed/smart_explorer
          test -s ../release-native/update-feed/smart_explorer_updater
          test -s ../release-native/update-feed/se
          test -s ../release-native/update-feed/smart_explorer.sha256
          test -s ../release-native/update-feed/smart_explorer_updater.sha256
          test -s ../release-native/update-feed/se.sha256
          test -s ../release-native/update-feed/windows-build.manifest
          test -s "../release-native/Smart Explorer Setup $ver.exe"
          test -s "../release-native/Smart Explorer.exe"
          test -s "../release-native/Smart Explorer Updater.exe"
          test -s ../release-native/se.exe
          test -s ../release-native/share-server/se-share-server.exe
          test -s ../release-native/share-server/se-share-server-linux
          test -s ../release-native/smart_explorer_command.dll
          test -x ../install-linux.sh
          (
            cd ../release-native/update-feed
            sha256sum -c smart_explorer.exe.sha256
            sha256sum -c smart_explorer_updater.exe.sha256
            sha256sum -c se.exe.sha256
            sha256sum -c smart_explorer.sha256
            sha256sum -c smart_explorer_updater.sha256
            sha256sum -c se.sha256
            for payload in \
              smart_explorer.exe smart_explorer_updater.exe se.exe \
              smart_explorer smart_explorer_updater se; do
              expected="$(awk 'NR == 1 { print $1 }' "$payload.sha256")"
              actual="$(sha256sum "$payload" | awk '{ print $1 }')"
              if ! [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || [[ "${expected,,}" != "$actual" ]]; then
                echo "::error::$payload.sha256 does not bind the exact $payload bytes."
                exit 1
              fi
            done
          )
          manifest=../release-native/update-feed/windows-build.manifest
          if [[ "$(awk -F= '$1 == "version" { count++; value=substr($0, index($0, "=") + 1) } END { sub(/\r$/, "", value); if (count != 1) exit 1; print value }' "$manifest")" != "$ver" ]]; then
            echo "::error::Committed Windows build manifest does not bind version $ver."
            exit 1
          fi
          for payload in smart_explorer.exe smart_explorer_updater.exe se.exe; do
            hash="$(sha256sum "../release-native/update-feed/$payload" | awk '{print $1}')"
            if [[ "$(tr -d '\r' < "$manifest" | grep -Fxc "$payload=$hash")" != 1 ]]; then
              echo "::error::Committed Windows build manifest does not bind $payload."
              exit 1
            fi
          done
          file ../release-native/update-feed/smart_explorer | grep -Eq 'statically linked|static-pie linked'
          file ../release-native/share-server/se-share-server-linux | grep -Eq 'statically linked|static-pie linked'
          x86_64-w64-mingw32-objdump -p ../release-native/smart_explorer_command.dll | grep -q DllGetClassObject
          x86_64-w64-mingw32-objdump -p ../release-native/smart_explorer_command.dll | grep -q DllCanUnloadNow
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "${GITHUB_REF_NAME#v}" != "$ver" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $ver."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            branch_ver="${GITHUB_REF_NAME##*/}"
            branch_ver="${branch_ver#v}"
            if [[ "$branch_ver" != "$ver" ]]; then
              echo "::error::Release branch $GITHUB_REF_NAME does not match Cargo.toml version $ver."
              exit 1
            fi
          fi
          # Fresh builds above are compile gates. GitHub Release assets must be
          # the exact committed artifacts that installed clients fetch and that
          # this release gate just verified, so replace out/ only after checks.
          for asset in \
            smart_explorer.exe smart_explorer_updater.exe se.exe \
            smart_explorer.exe.sha256 smart_explorer_updater.exe.sha256 se.exe.sha256 \
            smart_explorer smart_explorer_updater se \
            smart_explorer.sha256 smart_explorer_updater.sha256 se.sha256 \
            version.txt; do
            cp "../release-native/update-feed/$asset" "out/$asset"
          done
          cp "../release-native/Smart Explorer Setup $ver.exe" "out/Smart Explorer Setup $ver.exe"
          cp ../release-native/smart_explorer_command.dll out/smart_explorer_command.dll
          cp ../release-native/share-server/se-share-server.exe out/se-share-server.exe
          cp ../release-native/share-server/se-share-server-linux out/se-share-server-linux
          cp ../install-linux.sh out/install-linux.sh
          echo "Committed feed and release assets match Cargo.toml ($ver); out/ now contains the verified committed bytes."

      - name: Publish GitHub Release
        # Fires on a v* tag, a manual dispatch, OR a push to a release/** branch.
        # The branch path is the one that works where the git host rejects tag
        # pushes and the token can't dispatch: push `release/vX.Y.Z` and CI cuts
        # the tag + release from Cargo.toml's version.
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          # On a manual dispatch (no tag ref), create the tag at this commit.
          tag_name: v${{ steps.stage.outputs.version }}
          name: Smart Explorer ${{ steps.stage.outputs.version }}
          body: |
            **Smart Explorer ${{ steps.stage.outputs.version }}** — Windows x64 and Linux x86_64 desktop builds.

            Linux one-line install:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/b1ue-man/smart-explorer/main/install-linux.sh | sh
            ```

            - **Smart Explorer Setup ${{ steps.stage.outputs.version }}.exe** —
              installer (recommended). Sets up auto-update from the Git feed and
              the right-click "In Smart Explorer öffnen" verb.
            - **smart_explorer.exe** — portable app (also the self-update
              payload). For auto-update, set the update source to this repo's URL
              in the app (Sidebar → UPDATE), or use the installer.
            - **se.exe** / **se** — terminal companion for saved remote and
              Smart Explorer peer operations.
            - **smart_explorer_command.dll** — Win11 modern context-menu
              IExplorerCommand handler (needs signing to register; see
              `docs/WIN11_CONTEXT_MENU.md`).
            - **smart_explorer** / **smart_explorer_updater** — Linux x86_64
              desktop app and updater payloads used by the one-line installer.
            - **se-share-server.exe** / **se-share-server-linux** —
              standalone signaling server plus Iroh encrypted-traffic relay for
              direct peer sharing.

            Built by CI (ubuntu + mingw-w64 + `x86_64-pc-windows-gnu`). Update +
            release flow: `docs/RELEASING.md`.
          files: |
            native/out/Smart Explorer Setup ${{ steps.stage.outputs.version }}.exe
            native/out/smart_explorer.exe
            native/out/smart_explorer_updater.exe
            native/out/se.exe
            native/out/smart_explorer.exe.sha256
            native/out/smart_explorer_updater.exe.sha256
            native/out/se.exe.sha256
            native/out/smart_explorer
            native/out/smart_explorer_updater
            native/out/se
            native/out/smart_explorer.sha256
            native/out/smart_explorer_updater.sha256
            native/out/se.sha256
            native/out/install-linux.sh
            native/out/smart_explorer_command.dll
            native/out/se-share-server.exe
            native/out/se-share-server-linux
            native/out/version.txt

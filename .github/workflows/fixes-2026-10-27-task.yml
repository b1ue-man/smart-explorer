name: fixes-2026-10-27-task
run-name: Targeted 0.5.185 fixes ${{ inputs.candidate_sha }}

# Narrow remote check for the targeted fixes of 2026-10-27 (user: "fixe
# gezielt die fehler … aber mache keine breiten review und test suits"):
# Linux and Windows compile library, binaries and tests with Clippy (findings
# count only on lines this batch changed since v0.5.185) and run the screen
# metadata runtime cases; Android builds and runs its JVM unit tests.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full pushed candidate SHA, matching the selected ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fixes-2026-10-27-task-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: search-recursive-access
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Clippy on library, binaries and tests; findings on changed lines fail
        shell: bash
        timeout-minutes: 140
        run: |
          # GitHub runs bash with -e; Clippy's own exit status must not end
          # the step before the findings are filtered.
          set +e -uo pipefail
          git diff -U0 --no-color v0.5.185 HEAD -- native/src > "$RUNNER_TEMP/diff.txt"
          cd native
          cargo clippy --lib --bins --tests --message-format short 2>&1 \
            | tr '\\' '/' | tee "$RUNNER_TEMP/clippy.txt"
          status=${PIPESTATUS[0]}
          # A compile error anywhere fails.
          if grep -E ': error\[E[0-9]+\]|^error\[E[0-9]+\]' "$RUNNER_TEMP/clippy.txt"; then
            echo "::error::compile errors (clippy status $status)"
            exit 1
          fi
          # Lints count only on lines this batch changed; older debt in the
          # same files does not.
          PY=$(command -v python3 || command -v python)
          "$PY" - "$RUNNER_TEMP/diff.txt" "$RUNNER_TEMP/clippy.txt" > "$RUNNER_TEMP/findings.txt" <<'PYEOF'
          import re, sys
          changed, current = {}, None
          for line in open(sys.argv[1], encoding="utf-8", errors="replace"):
              if line.startswith("+++ "):
                  path = line[4:].strip()
                  current = path[len("b/native/"):] if path.startswith("b/native/") else None
              elif line.startswith("@@") and current:
                  m = re.search(r"\+(\d+)(?:,(\d+))?", line)
                  start, count = int(m.group(1)), int(m.group(2) or 1)
                  changed.setdefault(current, set()).update(range(start, start + count))
          for line in open(sys.argv[2], encoding="utf-8", errors="replace"):
              m = re.match(r"^(src/[^:]+):(\d+):\d+: (error|warning)", line)
              if m and int(m.group(2)) in changed.get(m.group(1), ()):
                  print(line.rstrip())
          PYEOF
          if [[ -s "$RUNNER_TEMP/findings.txt" ]]; then
            echo "::error::findings on changed lines"
            sort -u "$RUNNER_TEMP/findings.txt"
            exit 1
          fi
          echo "clippy clean on changed lines"

      - name: Screen metadata runtime cases
        shell: bash
        timeout-minutes: 120
        run: |
          set -Eeuo pipefail
          cd native
          cargo test --lib screen_metadata_runtime_task_ -- --test-threads=1

  # The Android side of the batch (screen keyboard field, Android cfg of the
  # screen host): the existing Android build mode of the Android suite —
  # NDK check, x86_64 library, APKs and the JVM unit tests.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          log_root="$RUNNER_TEMP/android-task-logs"
          mkdir -p "$log_root"
          printf 'SMART_EXPLORER_TASK_LOG_ROOT=%s\n' "$log_root" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: android-task-ndk
          cache-on-failure: true

      - name: Android build, APKs and JVM unit tests
        shell: bash
        timeout-minutes: 140
        run: |
          set -Eeuo pipefail
          bash android/test-android-task.sh android-build --out "$RUNNER_TEMP/android-task-apk" 2>&1 | \
            tee "$SMART_EXPLORER_TASK_LOG_ROOT/suite-android-build.log"

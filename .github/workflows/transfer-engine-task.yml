name: transfer-engine-task

# Single task-level suite for the streaming transfer engine batch
# (docs/superpowers/plans/2026-09-28-transfer-engine/). Dispatch it for the
# exact pushed candidate SHA; it never publishes anything. The jobs (rustfmt
# and clippy are no part of them: build.yml has them, docs/TODO.md H1):
#   linux          milestone tests, affected integrations, container transfers,
#                  throughput over shaped loopback
#   windows        Windows milestones (virtual files, local kernel copy)
#   android-host   the Android batch's host checks (mobile facade unchanged)
#   desktop-bins   Linux `se` + `se-share-server` for the device Share check
#   android-build  Android tree, NDK, APKs, JVM tests
#   device         the Android device suite on an emulator (transfers included)
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to verify (must match the selected ref)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: transfer-engine-task-${{ github.repository }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the run to the exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          log_root="$RUNNER_TEMP/transfer-engine-task-logs"
          mkdir -p "$log_root"
          printf 'SMART_EXPLORER_TASK_LOG_ROOT=%s\n' "$log_root" >> "$GITHUB_ENV"
          checked_out_sha="$(git rev-parse HEAD)"
          printf 'requested_sha=%s\nworkflow_sha=%s\nchecked_out_sha=%s\n' \
            "$CANDIDATE_SHA" "$GITHUB_SHA" "$checked_out_sha" \
            > "$log_root/candidate.txt"
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be one full 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA,,}" != "${GITHUB_SHA,,}" ]] || \
             [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Selected ref, requested candidate, and checked-out commit differ."
            exit 1
          fi

      - name: Rust toolchain and dependency cache
        uses: ./.github/actions/native-setup
        with:
          workspaces: |
            native
            share-server

      - name: Install the server-check tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y jq iproute2
          jq --version
          docker --version
          # The shaped-link throughput check needs the netem qdisc; Azure
          # kernels ship it in the extra modules package.
          if ! sudo modprobe sch_netem 2>/dev/null; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          fi

      - name: Run the task-level suite
        shell: bash
        timeout-minutes: 160
        run: |
          set -Eeuo pipefail
          bash native/test-transfer-engine-task.sh --direct 2>&1 | \
            tee "$SMART_EXPLORER_TASK_LOG_ROOT/suite.log"

      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: transfer-engine-task-linux-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transfer-engine-task-logs
          if-no-files-found: warn
          retention-days: 7

  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 1
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the run to the exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          log_root="$RUNNER_TEMP/transfer-engine-task-logs"
          mkdir -p "$log_root"
          printf 'SMART_EXPLORER_TASK_LOG_ROOT=%s\n' "$log_root" >> "$GITHUB_ENV"
          checked_out_sha="$(git rev-parse HEAD)"
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be one full 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA,,}" != "${GITHUB_SHA,,}" ]] || \
             [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Selected ref, requested candidate, and checked-out commit differ."
            exit 1
          fi

      - name: Rust toolchain and dependency cache
        uses: ./.github/actions/native-setup
        with:
          workspaces: native

      - name: Run the task-level suite (Windows milestones)
        shell: bash
        timeout-minutes: 170
        run: |
          set -Eeuo pipefail
          bash native/test-transfer-engine-task.sh --direct 2>&1 | \
            tee "$SMART_EXPLORER_TASK_LOG_ROOT/suite.log"

      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: transfer-engine-task-windows-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transfer-engine-task-logs
          if-no-files-found: warn
          retention-days: 7

  android-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the run to the exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          log_root="$RUNNER_TEMP/android-task-logs"
          mkdir -p "$log_root"
          printf 'SMART_EXPLORER_TASK_LOG_ROOT=%s\n' "$log_root" >> "$GITHUB_ENV"
          checked_out_sha="$(git rev-parse HEAD)"
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be one full 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA,,}" != "${GITHUB_SHA,,}" ]] || \
             [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Selected ref, requested candidate, and checked-out commit differ."
            exit 1
          fi

      - name: Rust toolchain and dependency cache
        uses: ./.github/actions/native-setup
        with:
          workspaces: native

      - name: Run the Android host checks
        shell: bash
        timeout-minutes: 170
        run: |
          set -Eeuo pipefail
          bash android/test-android-task.sh host 2>&1 | \
            tee "$SMART_EXPLORER_TASK_LOG_ROOT/suite-host.log"

      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: transfer-engine-task-android-host-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-task-logs

  desktop-bins:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the run to the exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          log_root="$RUNNER_TEMP/android-task-logs"
          mkdir -p "$log_root"
          printf 'SMART_EXPLORER_TASK_LOG_ROOT=%s\n' "$log_root" >> "$GITHUB_ENV"
          checked_out_sha="$(git rev-parse HEAD)"
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be one full 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA,,}" != "${GITHUB_SHA,,}" ]] || \
             [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Selected ref, requested candidate, and checked-out commit differ."
            exit 1
          fi

      - name: Rust toolchain and dependency cache
        uses: ./.github/actions/native-setup
        with:
          workspaces: |
            native
            share-server

      - name: Build the desktop Share binaries for the device job
        shell: bash
        timeout-minutes: 80
        run: |
          set -Eeuo pipefail
          bash android/test-android-task.sh desktop-bins --out "$RUNNER_TEMP/android-task-bin" 2>&1 | \
            tee "$SMART_EXPLORER_TASK_LOG_ROOT/suite-desktop-bins.log"

      - name: Hand the binaries to the device job
        uses: actions/upload-artifact@v4
        with:
          name: transfer-engine-task-bin-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/android-task-bin
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: transfer-engine-task-desktop-bins-logs-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-task-logs

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the run to the exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          log_root="$RUNNER_TEMP/android-task-logs"
          mkdir -p "$log_root"
          printf 'SMART_EXPLORER_TASK_LOG_ROOT=%s\n' "$log_root" >> "$GITHUB_ENV"
          checked_out_sha="$(git rev-parse HEAD)"
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be one full 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA,,}" != "${GITHUB_SHA,,}" ]] || \
             [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Selected ref, requested candidate, and checked-out commit differ."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Rust toolchain and dependency cache
        uses: ./.github/actions/native-setup
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          workspaces: native

      - name: Build and check the Android side
        shell: bash
        timeout-minutes: 140
        run: |
          set -Eeuo pipefail
          bash android/test-android-task.sh android-build --out "$RUNNER_TEMP/android-task-apk" 2>&1 | \
            tee "$SMART_EXPLORER_TASK_LOG_ROOT/suite-android-build.log"

      - name: Hand the APKs to the device job
        uses: actions/upload-artifact@v4
        with:
          name: transfer-engine-task-apk-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/android-task-apk
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: transfer-engine-task-android-build-logs-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-task-logs

  device:
    needs: [android-build, desktop-bins]
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the run to the exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          log_root="$RUNNER_TEMP/android-task-logs"
          mkdir -p "$log_root"
          printf 'SMART_EXPLORER_TASK_LOG_ROOT=%s\n' "$log_root" >> "$GITHUB_ENV"
          checked_out_sha="$(git rev-parse HEAD)"
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be one full 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA,,}" != "${GITHUB_SHA,,}" ]] || \
             [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Selected ref, requested candidate, and checked-out commit differ."
            exit 1
          fi

      - name: Download the debug and test APKs
        uses: actions/download-artifact@v4
        with:
          name: transfer-engine-task-apk-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/android-task-artifacts/apk

      - name: Download the desktop Share binaries
        uses: actions/download-artifact@v4
        with:
          name: transfer-engine-task-bin-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/android-task-artifacts/bin

      - name: Enable KVM for the emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the Android device suite
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 190
        env:
          SE_TASK_ARTIFACTS: ${{ runner.temp }}/android-task-artifacts
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          disk-size: 8G
          sdcard-path-or-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The script input runs line by line in separate shells: exactly one command here.
          script: bash android/test-android-task.sh emulator-run

      - name: Upload screenshots, logcat, reports and coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: transfer-engine-task-device-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-task-logs
          if-no-files-found: warn

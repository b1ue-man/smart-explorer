name: luecken-task
run-name: Security gaps (PQ key exchange, sealed secrets, exec accounts, SSH host keys) ${{ inputs.candidate_sha }}

# Single task-level suite of the 2026-10-16 gap-closing batch
# (docs/plaene/2026-10-16-luecken-schliessen/plan.md). Dispatch it once for the
# exact pushed candidate SHA; it never builds release artifacts or publishes.
# One entrypoint, native/test-luecken-task.py, with three jobs:
#   suite          (--job host) fmt, development build, `luecken_task_` and
#                  affected unit tests on Linux and Windows; on Linux also the
#                  candidate share server (build, tests, lock versions, cargo
#                  audit), the static host-key check of the older suites, the
#                  porting of a plaintext secret store, SSH host-key
#                  confirmation/known_hosts/@revoked/ssh-agent against an
#                  OpenSSH container, Share Exec grants (default off, ported
#                  grant, program list and environment, audit log, run-as on a
#                  root worker, revoke) and the real update from the published
#                  `se` 0.5.180; on Windows the credential store
#   android        (--job android) the Android build stage (dependency tree,
#                  NDK, APKs, JVM tests)
#   android-device (--job android-device) the published APK 0.5.180 updated to
#                  the candidate APK on an emulator (same-certificate signing
#                  with the repository's release keystore secrets, as in
#                  sync-reliability-task.yml)
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full pushed candidate SHA, matching the selected ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: luecken-task-${{ github.repository }}
  cancel-in-progress: false

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # The fmt stage diffs the batch against its base commit and the update
          # stage reads the published `se` 0.5.180 from that commit's update feed.
          fetch-depth: 0
          persist-credentials: false

      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            share-server
          # Reuse the preceding host-library tasks' dependency/incremental output.
          shared-key: search-recursive-access
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Run the one task entrypoint
        shell: bash
        timeout-minutes: 350
        run: >-
          python native/test-luecken-task.py
          --log-root "$RUNNER_TEMP/luecken-task"

      - name: Preserve acceptance and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luecken-${{ runner.os }}-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/luecken-task
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: android-task-ndk
          cache-on-failure: true

      - name: Run the one task entrypoint (Android build stage)
        shell: bash
        timeout-minutes: 140
        run: >-
          python native/test-luecken-task.py --job android
          --log-root "$RUNNER_TEMP/luecken-task-android"

      - name: Preserve acceptance and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luecken-android-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/luecken-task-android
          if-no-files-found: error
          retention-days: 14

  android-device:
    runs-on: ubuntu-24.04
    # Build (up to 130 min cold) and emulator run (about 40 min) share the job.
    timeout-minutes: 330
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # The published APK is read from the update feed of the base commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: rv1-ndk
          cache-on-failure: true

      - name: Prepare same-certificate development signing
        shell: bash
        env:
          KEYSTORE_BYTES: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -Eeuo pipefail
          test -n "$KEYSTORE_BYTES"
          umask 077
          printf '%s' "$KEYSTORE_BYTES" | base64 --decode > "$RUNNER_TEMP/luecken-release.keystore"

      - name: Build the candidate APKs and fetch the published APK
        shell: bash
        timeout-minutes: 140
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/luecken-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          python native/test-luecken-task.py --job android-device --phase build
          --apks "$RUNNER_TEMP/luecken-apks"
          --log-root "$RUNNER_TEMP/luecken-task-android-device/build"

      - name: Remove the task signing file
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/luecken-release.keystore"

      - name: Enable KVM for the dedicated emulator
        shell: bash
        run: |
          sudo -n true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 120
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          disk-size: 8G
          sdcard-path-or-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python native/test-luecken-task.py --job android-device --phase device --apks "$RUNNER_TEMP/luecken-apks" --log-root "$RUNNER_TEMP/luecken-task-android-device/device"

      - name: Preserve acceptance and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luecken-android-device-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/luecken-task-android-device
          if-no-files-found: error
          retention-days: 14

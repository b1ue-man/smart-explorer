name: direct-open-task
run-name: Direct opening and sync conflict repair ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full pushed candidate SHA, matching the selected ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: direct-open-task-${{ github.repository }}
  cancel-in-progress: false

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 250
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      # Reuse the preceding host-library task's dependency/incremental output.
      - name: Rust toolchain and dependency cache
        uses: ./.github/actions/native-setup
        with:
          workspaces: native

      - uses: actions/setup-java@v6
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run the one task entrypoint
        shell: bash
        timeout-minutes: 245
        run: >-
          python native/test-direct-open-task.py
          --log-root "$RUNNER_TEMP/direct-open-task"

      - name: Preserve acceptance and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-open-${{ runner.os }}-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/direct-open-task
          if-no-files-found: error
          retention-days: 14

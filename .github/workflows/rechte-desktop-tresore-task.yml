    needs: [prepare, linux-core, linux-root, linux-2204, linux-desktop, linux-wayland, linux-gnome,
            windows-core, windows-screen, windows-desktop, desktop-bins, android-build, android-device,
            android-device-api30, linux-speed-net, linux-speed-local, windows-speed]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RDT_NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download every job report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: rdt-report-*
          path: ${{ runner.temp }}/rdt-reports

      - name: Overview over every job
        shell: bash
        timeout-minutes: 30
        run: >-
          python native/test-rechte-desktop-tresore-task.py --job report
          --log-root "$RUNNER_TEMP/rdt-report"
          --reports "$RUNNER_TEMP/rdt-reports"

      - name: Preserve the overview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdt-overview-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rdt-report
          if-no-files-found: warn
          retention-days: 14

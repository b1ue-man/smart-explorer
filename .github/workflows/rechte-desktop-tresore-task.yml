      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: rechte-desktop-tresore
          cache-on-failure: true

      - name: Install GNOME Shell and DING (D3 linux-gnome; not run when the shell does not start)
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n apt-get update
          sudo -n apt-get install -y gnome-shell gnome-shell-extension-desktop-icons-ng mesa-vulkan-drivers libwayland-client0

      - name: Run the one task entrypoint
        shell: bash
        timeout-minutes: 170
        run: >-
          python native/test-rechte-desktop-tresore-task.py --job linux-gnome

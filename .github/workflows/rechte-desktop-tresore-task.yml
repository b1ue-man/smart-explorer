  android-device:
    needs: [android-build, desktop-bins]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Missing inputs make the device stages report "not run" with the reason.
      - name: Download the debug and test APKs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: rdt-apks
          path: ${{ runner.temp }}/rdt-apks

      - name: Download the desktop se and share server
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: rdt-desktop-bins
          path: ${{ runner.temp }}/rdt-desktop-bins

      - name: Enable KVM for the emulator
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo -n tee /etc/udev/rules.d/99-kvm4all.rules
          sudo -n udevadm control --reload-rules
          sudo -n udevadm trigger --name-match=kvm

      - name: Device stages on the emulator, API 36
        id: emulator36
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 110
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          disk-size: 8G
          sdcard-path-or-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The script input runs line by line in separate shells: exactly one command.
          script: python native/test-rechte-desktop-tresore-task.py --job android-device --phase device --api-level 36 --log-root "$RUNNER_TEMP/rdt-android-device" --apks "$RUNNER_TEMP/rdt-apks" --bins "$RUNNER_TEMP/rdt-desktop-bins"

      # D3 assumption: without an API 36 system image the instrumentation runs on API 35
      # and the report names it. The marker file exists once the device phase started.
      - name: Device stages on the emulator, fallback API 35
        id: emulator35
        if: ${{ !cancelled() && steps.emulator36.outcome == 'failure' && hashFiles('.rdt-emulator-started') == '' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 110
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          disk-size: 8G
          sdcard-path-or-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python native/test-rechte-desktop-tresore-task.py --job android-device --phase device --api-level 36 --log-root "$RUNNER_TEMP/rdt-android-device" --apks "$RUNNER_TEMP/rdt-apks" --bins "$RUNNER_TEMP/rdt-desktop-bins"

      - name: Inventory, summary and verdict of the device job
        if: always()
        shell: bash
        timeout-minutes: 30
        run: >-
          python native/test-rechte-desktop-tresore-task.py --job android-device --phase verdict
          --api-level 36 --log-root "$RUNNER_TEMP/rdt-android-device"

      - name: Hand the report to the overview job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdt-report-android-device
          path: ${{ runner.temp }}/rdt-android-device/report.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Preserve acceptance and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdt-android-device-evidence-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rdt-android-device
          if-no-files-found: warn
          retention-days: 14


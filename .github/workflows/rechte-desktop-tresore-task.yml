      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Place native/Cargo.lock and the license file of the job prepare
        uses: actions/download-artifact@v4
        with:
          name: rdt-prepare
          path: ${{ github.workspace }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: rechte-desktop-tresore
          cache-on-failure: true

      # Missing fuse3 turns the FUSE entries into "not run" with the reason.
      - name: Install fuse3 for the FUSE stages
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n apt-get update
          sudo -n apt-get install -y fuse3

      - name: Run the one task entrypoint
        shell: bash
        timeout-minutes: 230
        run: >-
          python native/test-rechte-desktop-tresore-task.py --job linux-root
          --log-root "$RUNNER_TEMP/rdt-linux-root"

      - name: Hand the report to the overview job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdt-report-linux-root
          path: ${{ runner.temp }}/rdt-linux-root/report.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Preserve acceptance and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdt-linux-root-evidence-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rdt-linux-root
          if-no-files-found: warn
          retention-days: 14

  linux-2204:
    needs: prepare
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    # D3/C2: only when GitHub still offers the image; a job without report.json is
    # reported by the overview job as "not run" instead of failing the run.
    continue-on-error: true
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0

          path: ${{ runner.temp }}/rdt-windows-core/report.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Preserve acceptance and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdt-windows-core-evidence-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rdt-windows-core
          if-no-files-found: warn

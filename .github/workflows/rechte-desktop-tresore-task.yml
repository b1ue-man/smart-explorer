name: rechte-desktop-tresore-task
run-name: Rechte, se Desktop, Tresore (Stapel 2026-10-17) ${{ inputs.candidate_sha }}

# The one task-level suite of the batch "Rechte, se Desktop, Tresore"
# (docs/plaene/2026-10-17-rechte-desktop-tresore/plan.md, D3). Dispatch it once for
# the exact pushed candidate SHA; it never builds release artifacts or publishes.
# Every job runs the one entrypoint native/test-rechte-desktop-tresore-task.py with
# --job <JOB>; stages, expected test names and fixtures live in native/rdt_task/.
#   prepare               lock (resolution without --locked), audit, licenses
#                         (native/licenses_task_checks.py), static; artifact
#                         rdt-prepare = native/Cargo.lock + license file (L1, L2)
#   linux-core            unit, perm-pair, drive-cli, drive-devices, vault-*,
#                         screen-pair (U41), docs-cli
#   linux-root            root and account-service stages, FUSE, vault drives
#   linux-2204            perm_task_exec_linux_ubuntu2204_starts on systemd 249;
#                         without the image the overview job reports it as not run
#   linux-desktop, linux-wayland, linux-gnome, windows-screen, windows-desktop
#                         S4/S5 stages of suite part B (U41) plus the shared
#                         gui-harness and drive-desktop stages
#   windows-core          unit, perm-windows, Dokany regression, drive and vault stages
#   desktop-bins          Linux se + share server (development profile) for device pairs
#   android-build         debug and test APK (x86_64 emulator only), JVM/Robolectric tests
#   android-device        emulator API 36 (fallback API 35), android-device-api30 API 30
#   report                overview of every job's report.json
# Each job writes report.json (every test: passed / failed / not_run with reason) and
# a job summary; "not run" never counts as passed.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character pushed candidate SHA, matching the selected ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rechte-desktop-tresore-task-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # The stale search diffs the documentation against the batch base da2646d2.
          fetch-depth: 0
          persist-credentials: false

      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          # Registry and installed tools (cargo-audit, cargo-about) only; a separate key keeps
          # this almost empty target folder away from the build caches of the other jobs.
          shared-key: rechte-desktop-tresore-prepare
          cache-on-failure: true

      - name: Run the one task entrypoint (lock, audit, licenses, static)
        shell: bash
        timeout-minutes: 55
        run: >-
          python native/test-rechte-desktop-tresore-task.py --job prepare
          --log-root "$RUNNER_TEMP/rdt-prepare"
          --out "$RUNNER_TEMP/rdt-prepare-out"

      - name: Hand native/Cargo.lock and the license file to the later jobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdt-prepare
          path: ${{ runner.temp }}/rdt-prepare-out
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Hand the report to the overview job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdt-report-prepare
          path: ${{ runner.temp }}/rdt-prepare/report.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Preserve acceptance and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdt-prepare-evidence-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rdt-prepare
          if-no-files-found: warn
          retention-days: 14

  linux-core:
    needs: prepare
    # prepare fails as planned in the first run (L1, L2); the other jobs still run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Place native/Cargo.lock and the license file of the job prepare
        uses: actions/download-artifact@v4
        with:
          name: rdt-prepare
          path: ${{ github.workspace }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # CryptoFS 2.11.0 (vault-interop) is compiled for Java 25. No cache: no CryptoFS
      # jar may end up in an artifact or a cache (strang-tresore.md VLT-M14, NR G21).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            share-server
          shared-key: rechte-desktop-tresore
          cache-on-failure: true

      - name: Load sch_netem for the netem checks of screen-pair (U41)
        continue-on-error: true
        shell: bash
        run: sudo -n modprobe sch_netem

      - name: Run the one task entrypoint
        shell: bash
        timeout-minutes: 350
        run: >-
          python native/test-rechte-desktop-tresore-task.py --job linux-core
          --log-root "$RUNNER_TEMP/rdt-linux-core"

      - name: Hand the report to the overview job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdt-report-linux-core
          path: ${{ runner.temp }}/rdt-linux-core/report.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Preserve acceptance and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdt-linux-core-evidence-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rdt-linux-core
          if-no-files-found: warn
          retention-days: 14

  linux-root:
    needs: prepare
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

  linux-wayland:
    needs: prepare
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # desktop_task_lock_only_expected_additions compares native/Cargo.lock with da2646d2.
          fetch-depth: 0
          persist-credentials: false

      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Place native/Cargo.lock and the license file of the job prepare
        uses: actions/download-artifact@v4
        with:
          name: rdt-prepare
          path: ${{ github.workspace }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: rechte-desktop-tresore
          cache-on-failure: true

      - name: Install sway and the wlroots portal (D3 linux-wayland)
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n apt-get update
          sudo -n apt-get install -y sway grim pipewire wireplumber xdg-desktop-portal xdg-desktop-portal-wlr mesa-vulkan-drivers wtype wl-clipboard libegl1 libgl1 libgl1-mesa-dri libegl-mesa0

      - name: Try KWin Wayland and the KDE portal (S4 K3; not run when missing)
        continue-on-error: true
        shell: bash
        run: sudo -n apt-get install -y kwin-wayland xdg-desktop-portal-kde foot


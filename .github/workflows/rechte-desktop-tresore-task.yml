      - name: Install the X11 desktop tools (D3 linux-desktop)
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n apt-get update
          sudo -n apt-get install -y xvfb xauth x11-utils openbox xfwm4 xfdesktop4 x11-xserver-utils xdotool ffmpeg fuse3 mesa-vulkan-drivers libegl1 libgl1 libgl1-mesa-dri libx11-6 libx11-xcb1 libxcursor1 libxi6 libxkbcommon0 libxkbcommon-x11-0 libxrandr2

      - name: Run the one task entrypoint
        shell: bash
        timeout-minutes: 290
        run: >-
          python native/test-rechte-desktop-tresore-task.py --job linux-desktop
          --log-root "$RUNNER_TEMP/rdt-linux-desktop"

      - name: Hand the report to the overview job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdt-report-linux-desktop

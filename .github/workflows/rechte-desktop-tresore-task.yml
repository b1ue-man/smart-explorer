        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdt-linux-wayland-evidence-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rdt-linux-wayland

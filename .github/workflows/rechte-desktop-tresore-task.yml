  windows-core:
    needs: prepare
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind workflow and checkout to the requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Place native/Cargo.lock and the license file of the job prepare
        uses: actions/download-artifact@v4
        with:
          name: rdt-prepare
          path: ${{ github.workspace }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            share-server
          shared-key: rechte-desktop-tresore
          cache-on-failure: true

      # Dokany: the stages install it only from SE_TASK_DOKANY_MSI with a matching
      # SE_TASK_DOKANY_MSI_SHA256; without both, the Dokany entries are "not run".
      # The pin is the installer's (native/dokany-runtime.nsh); the stage checks the hash.
      - name: Fetch the pinned Dokany MSI
        shell: bash
        run: |
          pin() { tr -d '\r' < native/dokany-runtime.nsh | sed -n "s/^!define $1 \"\(.*\)\"$/\1/p"; }
          url=$(pin DOKANY_MSI_URL); sha=$(pin DOKANY_MSI_SHA256); msi="$RUNNER_TEMP/$(pin DOKANY_MSI_FILENAME)"
          if [ -n "$url" ] && [ -n "$sha" ] && curl -fsSL --retry 3 -o "$msi" "$url"; then
            echo "SE_TASK_DOKANY_MSI=$msi" >> "$GITHUB_ENV"
            echo "SE_TASK_DOKANY_MSI_SHA256=$sha" >> "$GITHUB_ENV"
          else
            echo "::warning::Dokany MSI not fetched; the Dokany entries stay not run"
          fi

      - name: Run the one task entrypoint
        shell: bash
        timeout-minutes: 350
        run: >-
          python native/test-rechte-desktop-tresore-task.py --job windows-core
          --log-root "$RUNNER_TEMP/rdt-windows-core"

      - name: Hand the report to the overview job

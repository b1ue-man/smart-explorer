[package]
name = "smart_explorer"
version = "0.5.184"
edition = "2021"
authors = ["Silas <weizenbein1@gmail.com>"]
description = "Fast native file explorer with deep filtering"
license = "MIT"
publish = false

# The Android JNI library shares this crate's Cargo.lock and profiles. The root
# package stays the default member, so desktop commands run in `native/` are
# unchanged. `explorer-command` keeps its own lock and release profile.
[workspace]
members = ["android-bridge"]
exclude = ["explorer-command"]

# P28: application frames require a validated path/policy generation before
# serialization. Keep these three upstream pins together; provenance, API and
# rebase/removal conditions are in vendor/SMART_EXPLORER_ROUTE_POLICY.md.
[patch.crates-io]
iroh = { path = "../vendor/iroh-1.3.0" }
noq = { path = "../vendor/noq-1.3.0" }
noq-proto = { path = "../vendor/noq-proto-1.3.0" }

[[bin]]
name = "se-mcp-launcher"
path = "src/bin/se_mcp_launcher.rs"

[dependencies]
rayon = "1.10"
# Screen still pictures (SCR-M4): PNG encoder and decoder of `screen::core::snapshot`.
png = "0.18"
crossbeam-channel = "0.5"
ctrlc = "3.5"
# The conflict editor uses deadline-aware Myers line diffs (linear auxiliary
# space) instead of allocating a quadratic LCS table. Only the std/text API is
# enabled, so this remains a pure-Rust dependency for both release targets.
similar = { version = "3.1.1", default-features = false, features = ["std", "text"] }
notify = "6"
regex = "1"
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
# Dynamic completion lets `se` complete live Share request/grant/peer selectors
# instead of only static command names. It is pure Rust on every release target.
clap_complete = { version = "4.6.7", features = ["unstable-dynamic"] }
# Blocking HTTP client for the git/HTTPS update feed (updater.rs). `tls` pulls
# rustls backed by **ring** (verified: no aws-lc-sys in the tree) + bundled
# webpki-roots — so it cross-compiles on windows-gnu without NASM/CMake and
# needs no OS cert store. See docs/GOTCHAS.md (aws-lc-rs trap).
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# SFTP backend (sftp.rs). russh's DEFAULT crypto is aws-lc-rs (needs NASM/CMake,
# breaks on GNU) — so default-features=false + ring. See docs/GOTCHAS.md.
# 0.64 carries the published client fixes up to GHSA-4wc5-f2rc-q74m (2026-10-05);
# since 0.63 `check_server_key` receives `PublicKeyOrCertificate`.
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "2"
# Multi-thread runtime: a worker thread drives russh's background connection
# task continuously, so the blocking Backend bridge (rt.block_on per op) is
# robust without an always-running dedicated thread. See sftp.rs.
tokio = { version = "1", default-features = false, features = ["fs", "rt", "rt-multi-thread", "net", "io-util", "sync", "time"] }
# S09 invalidates a pinned LAN status proof on every Iroh path event.
# Pure Rust stream helpers, already resolved transitively through Iroh.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# FTP/FTPS backend (ftp.rs). Blocking FtpStream (no runtime). rustls (NOT
# native-tls) to avoid schannel/OpenSSL FFI on GNU. See docs/GOTCHAS.md.
# At least 10.0.2: RUSTSEC-2026-0271 (CR/LF command injection, fixed 10.0.2).
# Since 8.0.0 the rustls feature names its provider: only `rustls-ring`, never
# `rustls-aws-lc-rs` (no aws-lc in the lock, see the ureq/russh notes above).
suppaftp = { version = "10.0.2", default-features = false, features = ["rustls-ring"] }
# SMB2/3 backend (smb/). Pure Rust (RustCrypto, no C FFI); the default `tokio`
# feature shares the runtime crate above. Exact pin: the crate ships breaking
# minor releases quickly (docs/refs/smb2.md).
smb2 = "=0.26.0"
# Remote writers stage data in an anonymous disk-backed file until the caller
# explicitly flushes. This keeps aborted/large uploads off the heap and avoids
# exposing partially written remote files before the commit boundary.
tempfile = "3"
# Explicit ring-backed rustls ClientConfig for FTPS (no aws-lc); webpki-roots
# bundles the trust store (no OS cert dependency). Shared 0.23 build with
# ureq/russh/suppaftp.
# At least 0.23.46: GHSA-2mjx (fixed 0.23.45) and GHSA-w44r/-c8m5 (fixed 0.23.46).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
# WebDAV cloud backend (webdav.rs): WebDAV is HTTP, so it reuses the verified
# ring-rustls ureq above. roxmltree parses PROPFIND multistatus XML (tiny, pure
# Rust); base64 for HTTP Basic auth (already in the tree via rustls).
roxmltree = "0.20"
base64 = "0.22"
# Cloud/OAuth (cloud.rs, #19): JSON for the Drive REST API + token responses,
# SHA-256 for the PKCE code-challenge, and OS randomness for the verifier/state.
# All pure Rust — no native libs, so the windows-gnu cross-compile is unaffected.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# SHA-256 of the Android duplicate search (analytics/.../reclaim/finder_compare.rs).
# `sha2` 0.10 hashes in software on aarch64 without its `asm` feature; ring
# selects the ARMv8 SHA-256 instructions (or SHA-NI) at run time. Already in
# every target's tree through rustls/iroh with these default features, so it
# adds no new native build step or cross-compile requirement.
ring = "0.17"
# Discoverable Share pairing: RFC 9807 OPAQUE authenticates the exact user PIN
# without exposing it to signaling. Suite v1 fixes Argon2id v0x13 to
# m=19456 KiB, t=2, p=1 and wipes its explicit work memory. Follow-up bundles
# use stage/direction-bound HKDF-SHA-512 keys with pure-Rust ChaCha20-Poly1305.
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20 = { version = "=0.10.0", default-features = false, features = ["rng", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
hkdf = "0.12.4"
zeroize = "1.8"
# Cross-platform file identity checks keep updater targets, staging payloads,
# and bookkeeping files from aliasing through hard links or symlinks.
same-file = "1"
getrandom = "0.2"
# MD5 (pure Rust) for content-equality compare using the SAME hash remotes
# expose natively (Google Drive md5Checksum, Nextcloud/ownCloud oc:checksums) —
# so checksum-mode sync compares hashes WITHOUT downloading remote files.
md5 = "0.7"
# Persistent sync state for incremental managed mirror jobs. `bundled` keeps the
# Windows release independent from a system SQLite installation.
rusqlite = { version = "0.40.1", features = ["bundled"] }
# Peer file sharing (share.rs, #21): Iroh 1.0 provides authenticated P2P QUIC
# connections by endpoint public key, with relay fallback over HTTP(S) relay
# servers. Keep the default ring-backed TLS stack; do not enable aws-lc.
# 1.1.0 fixes GHSA-7cq4-mhxw-xw78 (relay batch frame stalls relay input),
# GHSA-vwh7-9883-83xj and GHSA-jx4g-cg2x-jc35; 1.3.0 also lifts rustls.
iroh = { version = "=1.3.0", default-features = true, features = ["unstable-custom-transports"] }
# The QUIC congestion controllers Bbr3Config/CubicConfig for the measurement
# switch SE_SHARE_QUIC_CC (share/core/keepalive.rs, E13); iroh does not
# re-export them. Same version as iroh's own dependency in Cargo.lock.
noq-proto = { version = "=1.3.0", default-features = false }
# Post-quantum hybrid X25519MLKEM768 for the Share TLS handshake
# (share/core/pq_kx.rs) on top of rustls' ring provider: ML-KEM-768 from the
# pure-Rust RustCrypto crate russh already uses, randomness from `rand`'s
# thread RNG exactly as russh's own hybrid ML-KEM key exchange does. No
# aws-lc, no C toolchain (docs/GOTCHAS.md).
ml-kem = "0.3"
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
# OpenSSH known_hosts lines with hashed host names (`|1|salt|HMAC-SHA1`); the
# same pure-Rust digest crate russh already pulls in.
sha1 = "0.10"
hmac = "0.12"
# Signaling and FTP host lookup use Hickory's async system-config resolver
# behind explicit deadlines instead of uncancellable libc getaddrinfo. Iroh
# already brings this pure-Rust version into the Windows/Linux build graph.
hickory-resolver = "0.26"
# Share-Server signaling fallback: WebSocket over HTTPS-friendly WSS. Keep
# default-features off so TLS stays on rustls/webpki and avoids native TLS.
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# Quick Share (quickshare.rs, #Q): mDNS discovery/advertisement of the Nearby
# Share service so Android devices appear on the LAN. Pure Rust (if-addrs +
# socket2), cross-compiles clean.
mdns-sd = "0.11"
if-addrs = "0.13"
# ZIP archive browse + extract (zipfs.rs). zip 9 (not 2.4.2): RUSTSEC-2026-0367
# (SUID/SGID bits on extraction), RUSTSEC-2026-0368 and RUSTSEC-2026-0369 (Unix
# permissions through links) are fixed from 9.0.0. Feature `deflate-flate2` (not
# `deflate`, which in zip 9 also pulls the Zopfli encoder and `zlib-rs`): deflate
# through flate2 with its pure-Rust miniz_oxide backend, which the direct `flate2`
# dependency below enables (zip itself builds flate2 without a backend), so no new
# C deps for the windows-gnu build.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# RV1 (all already in the lock through other crates): streaming WebDAV
# multistatus parsing, TCP keepalive on FTP sockets, NFC planning keys for
# sync pairs, deflate for remote analysis trees.
quick-xml = "0.39"
socket2 = "0.6"
icu_normalizer = { version = "2.2", default-features = false, features = ["compiled_data"] }
# Cryptomator vault format 8 (native/src/cryptomator, VLT-M1): the RustCrypto
# generation digest 0.11 / cipher 0.5 / aead 0.6 already in the lock (smb2,
# ssh-cipher), renamed beside the 0.10 generation above. New packages: only
# aes-siv and aes-kw. Pure Rust; zeroize wipes cipher key copies on drop.
aes-siv = { version = "0.8.0", default-features = false, features = ["alloc", "zeroize"] }
aes-kw = { version = "0.3.1", default-features = false }
aes-gcm-011 = { package = "aes-gcm", version = "0.11.1", default-features = false, features = ["aes", "zeroize"] }
aes-09 = { package = "aes", version = "0.9.1", default-features = false, features = ["zeroize"] }
ctr-010 = { package = "ctr", version = "0.10.1", default-features = false, features = ["zeroize"] }
hmac-013 = { package = "hmac", version = "0.13.0", default-features = false, features = ["zeroize"] }
sha2-011 = { package = "sha2", version = "0.11.0", default-features = false }
sha1-011 = { package = "sha1", version = "0.11.0", default-features = false }
scrypt = { version = "0.12.0", default-features = false }
data-encoding = { version = "2.11.0", default-features = false, features = ["alloc"] }
flate2 = "1"
# Lossless tile codec of the screen protocol (screen/core/tiles_codec.rs):
# pure-Rust LZ4 block format, already in the lock through smb2.
lz4_flex = "0.14"

# rfd is per-target so the crate also builds on a non-Windows host (CI / local
# `cargo test`): Windows uses the Win32 common-controls dialog; elsewhere the
# xdg-portal backend. This split has ZERO effect on the shipped Windows binary.
[target.'cfg(windows)'.dependencies]
# Windows secrets use Credential Manager. Linux deliberately uses the app's
# owner-protected, headless file store instead of a DBus/session keyring.
keyring = { version = "3", default-features = false, features = ["windows-native"] }
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    # `IP_ADAPTER_ADDRESSES_LH` references Ndis/WinSock types; the LAN link
    # classification (net/os/windows/interfaces.rs) reads it.
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WNet",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    # Handle-bound migration and verification of owner-only private storage.
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    # Installed Microsoft Photos generation picks its media launch method.
    "Win32_Storage_Packaging_Appx",
    # Native handle-relative no-replace rename of a confirmed recycle child.
    "Wdk_Storage_FileSystem",
    "Win32_System_Com",
    # RV1: volume arrival (CM_Register_Notification), bus type
    # (IOCTL_STORAGE_QUERY_PROPERTY), power requests while syncing or serving
    # peers, SetThreadErrorMode for silent volume probes.
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Ioctl",
    "Win32_System_Power",
    "Win32_System_WindowsProgramming",
    # `se share discoverable` reads a typed PIN with console echo switched off.
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    # The focused remote mount suite verifies real overlapped change watches.
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    # Vault screen-lock trigger: WTSRegisterSessionNotification (VLT-M4).
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# High-level Windows bindings for the Shell IContextMenu dance and the
# virtual-file IDataObject (filter-aware clipboard).
windows-core = "0.58"
winreg = "0.52"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    # Screen host (SCR-M3): Media Foundation H.264 encoder and decoder,
    # loaded at run time; D3D11/DXGI types appear in its MFT attributes.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    # Screen host (SCR-M4): Windows Graphics Capture of monitors and windows
    # (WGC interop factories, `IDirect3DDevice` from the DXGI device), DWM
    # window attributes, per-monitor DPI and the secure-desktop check.
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_System_StationsAndDesktops",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    # se Desktop jump list: PKEY_Title for the device entries.
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    # Remote virtual files: the drag hands the worker thread's data object to
    # the GUI thread as a marshaled proxy (CoMarshalInterface).
    "Win32_System_Com_Marshal",
    "Win32_System_Power",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    # Remote virtual files: COM-safe event waits and the worker's thread id.
    "Win32_System_Threading",
    # Screen host (SCR-M3): PROPVARIANT values of the Media Foundation codecs.
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    # se Desktop jump list: IPropertyStore on the device links.
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Networking_Connectivity",
    # Media launch with a neighboring-files query (Windows.System.Launcher)
    # so viewers can step to the previous/next file of the folder.
    "Foundation",
    "Foundation_Collections",
    "Storage",
    "Storage_Search",
    "System",
] }

# SCR-M3: OpenH264 as the user's Cisco download (BSD-2-Clause; with
# `libloading` no C code; pulls openh264-sys2 BSD-2-Clause and wide), the
# .bz2 unpacker (MIT OR Apache-2.0, pure-Rust libbz2-rs-sys: bzip2-1.0.6)
# and run-time loading of mfplat.dll (libloading, ISC). Rust >= 1.85.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
openh264 = { version = "0.9.9", default-features = false, features = ["libloading"] }
# Typed input/output timestamps; same dynamically loaded Cisco ABI, no source build.
openh264-sys2 = { version = "0.9.9", default-features = false, features = ["libloading"] }
bzip2 = "0.6"
libloading = "0.8"

# Desktop GUI and OS recycle bin. Android builds only the core library behind
# the Kotlin UI: egui/winit have no place in a Compose app, and `trash` 5 has no
# Android backend (Android uses the app trash in `apptrash`). Windows and Linux
# still resolve exactly the same packages as before this split.
[target.'cfg(not(target_os = "android"))'.dependencies]
# P13 edits only the owned MCP command/args while preserving user TOML layout.
# Same pure-Rust parser already in Cargo.lock; parse/display require Rust 1.85.
toml_edit = { version = "=0.25.11", default-features = false, features = ["parse", "display"] }
# `se mcp`: Model Context Protocol server for AI coding agents
# (docs/AI_AGENT_PLUGIN.md). rmcp answers both the `initialize` lifecycle
# (Codex starts with protocol 2025-06-18) and the stateless 2026-07-28
# `server/discover` lifecycle (Claude Code) on one stdio connection. Without
# default features: no macros, base64 or HTTP transports; MSRV 1.88.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
eframe = { version = "0.29", default-features = false, features = ["accesskit", "default_fonts", "glow", "wgpu"] }
# P6 queries the concrete viewer window; same 0.6 API as eframe, no new native library.
raw-window-handle = "0.6"
egui_extras = { version = "0.29", features = ["datepicker"] }
trash = "5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Host-only (CI / `cargo test`); never part of the Windows build.
[target.'cfg(not(windows))'.dependencies]
libc = "0.2" # renameat2(RENAME_NOREPLACE) for race-free local move quarantine

# rfd has no Android backend (and no D-Bus/Wayland there); Android picks files
# through the Storage Access Framework in Kotlin instead.
[target.'cfg(all(not(windows), not(target_os = "android")))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
# P3: bounded host-side SVG icons, Rust-only raster decoders. No system fonts,
# mmap-fonts, SVGZ or native font library; wire viewers receive PNG only.
resvg = { version = "=0.49.0", default-features = false, features = ["raster-images"] }
# Remote execution uses the systemd Manager D-Bus API directly for transient
# cgroup-backed services. The CLI never shells out to systemd-run.
zbus = { version = "5.16", default-features = false, features = ["tokio", "blocking-api"] }
# DRV-M4: FUSE host of Linux drives; pure-Rust mount through the setuid
# fusermount3 (no libfuse, no pkg-config run on Linux). MIT. Rust >= 1.85.
fuser = { version = "=0.18.0", default-features = false }
# SCR-M5: Linux screen host. X11 capture (x11rb, MIT OR Apache-2.0, pulls
# gethostname Apache-2.0), Wayland toplevel and KDE window lists (wayland-*,
# MIT) and the ScreenCast/RemoteDesktop portal (ashpd, MIT). PipeWire itself is
# loaded at run time, so no system library is needed at build time.
x11rb = { version = "0.13", default-features = false, features = ["allow-unsafe-code", "shm", "xfixes", "randr", "composite", "xtest", "res", "shape"] }
wayland-client = { version = "=0.31.14", features = ["dlopen", "system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "remote_desktop"] }
# DSK-M7: wlr-layer-shell host of the se Desktop surface (smithay-client-toolkit
# MIT, calloop MIT, xkbcommon-dl MIT, egui-wgpu MIT OR Apache-2.0). wayland-client
# loads libwayland at run time (dlopen) through the system backend.
smithay-client-toolkit = { version = "=0.19.2", default-features = false, features = ["calloop"] }
calloop = "=0.13.0"
calloop-wayland-source = "0.3"
xkbcommon-dl = "=0.4.2"
egui-wgpu = "=0.29.1"
# The window features of egui-winit (eframe's window layer) on Linux. Without
# them egui-winit compiles neither `with_name` (app id, WM_CLASS) nor
# `with_x11_window_type`: windows got argv[0] as their class and no desktop
# window type (suite run 3, desktop_task_x11_*). winit's x11 and wayland
# backends were already built; no further crate joins the lock.
egui-winit = { version = "=0.29.1", default-features = false, features = ["x11", "wayland"] }

[build-dependencies]
# Pure-Rust verification of prepared DLL bytes; never compile/download Dokany
# from build.rs. Both dependencies already occur in Cargo.lock.
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
# Full LTO and one monolithic codegen unit made the desktop crate exceed the
# memory available on supported 8-GiB release hosts. Thin LTO plus several
# smaller units bounds the peak while retaining cross-crate optimization.
lto = "thin"
codegen-units = 8
strip = "symbols"
# Dokany invokes Rust through FFI. Unwinding must reach the callback guards,
# which convert a panic into fail-stop mount teardown before it can cross back
# into Windows; the isolated mount-host process remains the outer boundary.
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.speed]
# The throughput stages of the task suite (`speed_task`, E13) measure the
# release optimization: an opt-level 1 build measured QUIC, SSH, LZ4 and
# signing code several times slower than what ships. Debug assertions stay on
# because the stages switch LZ4 off and collect transfer statistics only in
# builds with them (`SE_TEST_NO_LZ4`, `share-quic-stats.jsonl`); symbols stay
# for the backtraces of failing cases.
inherits = "release"
debug-assertions = true
strip = "none"

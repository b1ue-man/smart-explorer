[package]
name = "smart_explorer_android"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
smart_explorer = { path = ".." }

# The JNI exports exist only on Android; on every other target this library
# compiles empty. Versions are pinned to the ones in `native/Cargo.lock`.
[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"
ndk-context = "=0.1.1"
rustls-platform-verifier = "=0.7.0"
serde_json = "1.0.150"

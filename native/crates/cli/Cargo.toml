[package]
name = "smart_explorer_cli"
version.workspace = true
edition = "2021"
description = "Smart Explorer command line `se`"
license = "MIT"
publish = false

[dependencies]
smart_explorer_gui = { path = "../gui" }
crossbeam-channel.workspace = true
ctrlc.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true
tempfile.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ring.workspace = true
zeroize.workspace = true
getrandom.workspace = true
iroh = { version = "=1.3.0", default-features = true, features = ["unstable-custom-transports"] }
sha2-011.workspace = true

[target.'cfg(not(windows))'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
windows.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
toml_edit.workspace = true
rmcp.workspace = true
eframe.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
iroh = { version = "=1.3.0", default-features = true, features = ["test-utils"] }

[dev-dependencies]
smart_explorer_engine = { path = "../engine", features = ["test-support"] }

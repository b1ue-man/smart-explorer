[package]
name = "smart_explorer_engine"
version = "0.0.0"
edition = "2021"
description = "Smart Explorer engine: everything the GUI, the CLI and the Android facade share"
license = "MIT"
publish = false
build = "build.rs"

[features]
default = []
# Debug instrumentation APK only (screen bridge fixtures).
android-instrumentation-fixtures = []
# Test helpers the tests of the GUI, CLI and Android facade use (fixtures,
# fake remotes, the hash-cache turn); only their dev-dependency enables it.
test-support = []

[dependencies]
rayon.workspace = true
png.workspace = true
crossbeam-channel.workspace = true
ctrlc.workspace = true
similar.workspace = true
regex.workspace = true
globset.workspace = true
chrono.workspace = true
ureq.workspace = true
russh.workspace = true
russh-sftp.workspace = true
tokio.workspace = true
futures-util.workspace = true
suppaftp.workspace = true
smb2.workspace = true
tempfile.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
roxmltree.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ring.workspace = true
opaque-ke.workspace = true
argon2.workspace = true
chacha20.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
zeroize.workspace = true
same-file.workspace = true
getrandom.workspace = true
md5.workspace = true
rusqlite.workspace = true
iroh = { version = "=1.3.0", default-features = true, features = ["unstable-custom-transports"] }
noq-proto.workspace = true
ml-kem.workspace = true
rand.workspace = true
sha1.workspace = true
hmac.workspace = true
hickory-resolver.workspace = true
tungstenite.workspace = true
mdns-sd.workspace = true
if-addrs.workspace = true
zip.workspace = true
quick-xml.workspace = true
socket2.workspace = true
icu_normalizer.workspace = true
aes-siv.workspace = true
aes-kw.workspace = true
aes-gcm-011.workspace = true
aes-09.workspace = true
ctr-010.workspace = true
hmac-013.workspace = true
sha2-011.workspace = true
sha1-011.workspace = true
scrypt.workspace = true
data-encoding.workspace = true
flate2.workspace = true
lz4_flex.workspace = true

[target.'cfg(not(windows))'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
keyring.workspace = true
windows-sys.workspace = true
windows-core.workspace = true
winreg.workspace = true
windows.workspace = true

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
openh264.workspace = true
openh264-sys2.workspace = true
bzip2.workspace = true
libloading.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
trash.workspace = true
image.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
resvg.workspace = true
zbus.workspace = true
fuser.workspace = true
x11rb.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
wayland-protocols-plasma.workspace = true
ashpd.workspace = true
rcgen.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
iroh = { version = "=1.3.0", default-features = true, features = ["test-utils"] }

# build.rs: the deflated embedded files and the private Dokany contract.
[build-dependencies]
serde_json.workspace = true
sha2.workspace = true
flate2.workspace = true

[package]
name = "smart_explorer_mobile"
version = "0.0.0"
edition = "2021"
description = "Smart Explorer Android facade behind the Kotlin UI"
license = "MIT"
publish = false

[features]
default = []
android-instrumentation-fixtures = ["smart_explorer_engine/android-instrumentation-fixtures"]

[dependencies]
smart_explorer_engine = { path = "../engine" }
crossbeam-channel.workspace = true
globset.workspace = true
tokio.workspace = true
tempfile.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true
getrandom.workspace = true
md5.workspace = true
sha2-011.workspace = true

[target.'cfg(not(windows))'.dependencies]
libc.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
trash.workspace = true

[dev-dependencies]
smart_explorer_engine = { path = "../engine", features = ["test-support"] }
